views:
  bedrock_invocations_view:
    dependsOn: {}
    parameters:
      data_collection_database_name:
        type: athena
        query: SELECT DISTINCT table_schema FROM information_schema.columns WHERE table_name = 'bedrock_logs'
        error: "This means that prerequisites for the dashboard are not found. Please make sure you have the needed table: Data Collection installed, needed module is configured and Step Function runs correctly."
        default: optimization_data
        description: "Enter the name of the data collection database"
        global: True
    data: |-
      CREATE OR REPLACE VIEW "${athena_database_name}".bedrock_invocations_view AS
      SELECT
        account_id
      , CAST(from_iso8601_timestamp(timestamp) AS timestamp) timestamp
      , region
      , requestid
      , operation
      , modelid
      , identity_arn
      , JSON_FORMAT(CAST(requestmetadata AS JSON)) requestmetadata
      , year
      , month
      , day
      , input.inputtokencount input_tokens
      , input.inputcontenttype input_content_type
      , output.outputtokencount output_tokens
      , output.outputcontenttype output_content_type
      , CAST(COALESCE(json_extract_scalar(output.outputbodyjson, '$.usage.cacheReadInputTokens'), json_extract_scalar(output.outputbodyjson, '$.usage.cacheReadInputTokenCount'), json_extract_scalar(output.outputbodyjson, '$.usage.cache_read_input_tokens')) AS INTEGER) cache_read_tokens
      , CAST(COALESCE(json_extract_scalar(output.outputbodyjson, '$.usage.cacheWriteInputTokens'), json_extract_scalar(output.outputbodyjson, '$.usage.cacheWriteInputTokenCount'), json_extract_scalar(output.outputbodyjson, '$.usage.cache_creation_input_tokens')) AS INTEGER) cache_write_tokens
      , (COALESCE(input.inputtokencount, 0) + COALESCE(output.outputtokencount, 0) + COALESCE(CAST(COALESCE(json_extract_scalar(output.outputbodyjson, '$.usage.cacheReadInputTokens'), json_extract_scalar(output.outputbodyjson, '$.usage.cacheReadInputTokenCount'), json_extract_scalar(output.outputbodyjson, '$.usage.cache_read_input_tokens')) AS INTEGER), 0) + COALESCE(CAST(COALESCE(json_extract_scalar(output.outputbodyjson, '$.usage.cacheWriteInputTokens'), json_extract_scalar(output.outputbodyjson, '$.usage.cacheWriteInputTokenCount'), json_extract_scalar(output.outputbodyjson, '$.usage.cache_creation_input_tokens')) AS INTEGER), 0)) total_tokens
      , errorcode
      , inferenceregion
      , CAST(json_extract_scalar(output.outputbodyjson, '$.metrics.latencyMs') AS INTEGER) latency_ms
      , CAST(COALESCE(json_extract_scalar(input.inputbodyjson, '$.inferenceConfig.maxTokens'), json_extract_scalar(input.inputbodyjson, '$.max_tokens'), json_extract_scalar(input.inputbodyjson, '$.max_completion_tokens'), json_extract_scalar(input.inputbodyjson, '$.max_output_tokens'), json_extract_scalar(input.inputbodyjson, '$.inferenceConfig.max_new_tokens')) AS INTEGER) max_tokens_requested
      , CAST(COALESCE(json_extract_scalar(input.inputbodyjson, '$.inferenceConfig.temperature'), json_extract_scalar(input.inputbodyjson, '$.temperature')) AS DOUBLE) temperature
      , IF(json_extract(input.inputbodyjson, '$.system') IS NOT NULL, 'Yes', 'No') system_prompt
      , COALESCE(json_extract_scalar(output.outputbodyjson, '$.service_tier'), json_extract_scalar(output.outputbodyjson, '$.usage.service_tier')) service_tier
      , COALESCE(json_extract_scalar(output.outputbodyjson, '$.stopReason'), json_extract_scalar(output.outputbodyjson, '$.stop_reason'), CASE json_extract_scalar(output.outputbodyjson, '$.choices[0].finish_reason') WHEN 'stop' THEN 'end_turn' WHEN 'length' THEN 'max_tokens' ELSE json_extract_scalar(output.outputbodyjson, '$.choices[0].finish_reason') END, CASE json_extract_scalar(output.outputbodyjson, '$.incomplete_details.reason') WHEN 'max_output_tokens' THEN 'max_tokens' ELSE json_extract_scalar(output.outputbodyjson, '$.incomplete_details.reason') END, IF(json_extract_scalar(output.outputbodyjson, '$.status') = 'completed', 'end_turn')) stop_reason
      , substr(COALESCE(json_extract_scalar(output.outputbodyjson, '$.output.message.content[0].text'), json_extract_scalar(output.outputbodyjson, '$.output.message.content[1].text'), json_extract_scalar(output.outputbodyjson, '$.content[0].text'), json_extract_scalar(output.outputbodyjson, '$.completion'), json_extract_scalar(output.outputbodyjson, '$.outputText'), json_extract_scalar(output.outputbodyjson, '$.choices[0].message.content'), json_extract_scalar(output.outputbodyjson, '$.output[0].content[0].text'), json_extract_scalar(output.outputbodyjson, '$.output[1].content[0].text')), 1, 1000) response_preview
      , substr(COALESCE(json_extract_scalar(input.inputbodyjson, '$.messages[0].content[0].text'), json_extract_scalar(input.inputbodyjson, '$.messages[0].content'), json_extract_scalar(input.inputbodyjson, '$.input'), json_extract_scalar(input.inputbodyjson, '$.prompt'), json_extract_scalar(input.inputbodyjson, '$.inputText'), json_extract_scalar(input.inputbodyjson, '$.textToImageParams.text'), json_extract_scalar(input.inputbodyjson, '$.text_prompts[0].text')), 1, 1000) prompt_preview
      FROM
        "${data_collection_database_name}".bedrock_logs
      WHERE (from_iso8601_timestamp(timestamp) >= date_add('month', -6, current_timestamp))
