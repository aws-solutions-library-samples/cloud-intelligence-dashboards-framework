dashboards:
  Bedrock Unified Insights Lens Dashboard:
    dependsOn:
      datasets:
      - bedrock_invocations_view
    name: Bedrock Unified Insights Lens Dashboard
    dashboardId: bedrock-unified-insights-lens-dashboard
    category: Advanced
    theme: MIDNIGHT
    version: v1.0.0
    data: "AnalysisDefaults:\n  DefaultNewSheetConfiguration:\n    InteractiveLayoutConfiguration:\n\
      \      Grid:\n        CanvasSizeOptions:\n          ScreenCanvasSizeOptions:\n\
      \            OptimizedViewPortWidth: 1600px\n            ResizeOption: FIXED\n\
      \    SheetContentType: INTERACTIVE\nCalculatedFields:\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Account\n  Expression: 'ifelse(isNull({account_name})\
      \ OR {account_name} = '''', {account_id},\n    concat({account_name}, '' : '',\
      \ {account_id}))'\n- DataSetIdentifier: bedrock_invocations_view\n  Name: Bedrock\
      \ Group By\n  Expression: 'ifelse(\n\n    ${BedrockGroupBy} = ''Account'', {Account},\n\
      \n    ${BedrockGroupBy} = ''Region'', {region},\n\n    ${BedrockGroupBy} = ''Operation'',\
      \ {operation},\n\n    ${BedrockGroupBy} = ''Model'', {Model Name},\n\n    ${BedrockGroupBy}\
      \ = ''Identity Role'', {Identity Role},\n\n    ${BedrockGroupBy} = ''Identity\
      \ User'', {Identity User},\n\n    ${BedrockGroupBy} = ''Model Category'', {Model\
      \ Category},\n\n    // Add ${BedrockGroupBy}\n\n    NULL\n\n    )'\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Model Base\n  Expression: ifelse(contains({modelid},\
      \ '/'), substring({modelid}, locate({modelid},\n    '/') + 1, strlen({modelid})),\
      \ {modelid})\n- DataSetIdentifier: bedrock_invocations_view\n  Name: Model Name\n\
      \  Expression: \"ifelse(\\n  contains({modelid}, 'application-inference-profile/'),\
      \ concat('Application\\\n    \\ profile: ', {Model Base}),\\n  startsWith({Model\
      \ Base}, 'us-gov.'), substring({Model\\\n    \\ Base}, 8, strlen({Model Base})),\\\
      n  startsWith({Model Base}, 'global.'), substring({Model\\\n    \\ Base}, 8,\
      \ strlen({Model Base})),\\n  startsWith({Model Base}, 'apac.'), substring({Model\\\
      \n    \\ Base}, 6, strlen({Model Base})),\\n  startsWith({Model Base}, 'us.')\
      \ OR startsWith({Model\\\n    \\ Base}, 'eu.'), substring({Model Base}, 4, strlen({Model\
      \ Base})),\\n  {Model Base}\\n\\\n    )\"\n- DataSetIdentifier: bedrock_invocations_view\n\
      \  Name: Identity Role\n  Expression: ifelse(contains({identity_arn}, ':assumed-role/'),\
      \ split({identity_arn},\n    '/', 2), {identity_arn})\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Identity User\n  Expression: ifelse(contains({identity_arn},\
      \ ':assumed-role/'), split({identity_arn},\n    '/', 3), {identity_arn})\n-\
      \ DataSetIdentifier: bedrock_invocations_view\n  Name: Request Status\n  Expression:\
      \ ifelse(isNull({errorcode}), 'Successful', 'Failed')\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Error Rate\n  Expression: countIf({requestid},\
      \ NOT isNull({errorcode})) / count({requestid})\n- DataSetIdentifier: bedrock_invocations_view\n\
      \  Name: Request Outcome\n  Expression: \"ifelse(\\n  isNull({errorcode}), 'Successful',\\\
      n  {errorcode} = 'ThrottlingException',\\\n    \\ 'Throttled',\\n  {errorcode}\
      \ = 'ValidationException' OR {errorcode} = 'validation_error'\\\n    \\ OR {errorcode}\
      \ = 'unsupported_parameter', 'Validation Error',\\n  {errorcode}\\\n    \\ =\
      \ 'ResourceNotFoundException', 'Not Found',\\n  {errorcode} = 'InternalServerException'\\\
      \n    \\ OR {errorcode} = 'ServiceUnavailableException', 'Server Error',\\n\
      \  'Other Error'\\n\\\n    )\"\n- DataSetIdentifier: bedrock_invocations_view\n\
      \  Name: Avg Input per Request\n  Expression: avg(coalesce({input_tokens}, 0)\
      \ + coalesce({cache_read_tokens}, 0) +\n    coalesce({cache_write_tokens}, 0))\n\
      - DataSetIdentifier: bedrock_invocations_view\n  Name: Avg Output per Request\n\
      \  Expression: avg(coalesce({output_tokens}, 0))\n- DataSetIdentifier: bedrock_invocations_view\n\
      \  Name: Model Category\n  Expression: \"ifelse(\\n  contains(toLower({modelid}),\
      \ 'embed') OR contains(toLower({modelid}),\\\n    \\ 'rerank'), 'Embedding /\
      \ Rerank',\\n  contains(toLower({modelid}), 'canvas') OR\\\n    \\ contains(toLower({modelid}),\
      \ 'titan-image') OR contains(toLower({modelid}),\\\n    \\ 'stable-') OR contains(toLower({modelid}),\
      \ 'stability') OR contains(toLower({modelid}),\\\n    \\ 'reel') OR contains(toLower({modelid}),\
      \ 'video'), 'Image/Video',\\n  'LLM (Text/Chat)'\\n\\\n    )\"\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Traffic Type\n  Expression: \"ifelse(\\\
      n  contains({modelid}, 'provisioned-model'), 'Provisioned Throughput',\\n\\\n\
      \    \\  startsWith({modelid}, 'global.') OR contains({modelid}, 'inference-profile/global.'),\\\
      \n    \\ 'On-Demand - Global CRIS',\\n  startsWith({modelid}, 'us.') OR startsWith({modelid},\\\
      \n    \\ 'eu.') OR startsWith({modelid}, 'apac.') OR startsWith({modelid}, 'us-gov.')\\\
      \n    \\ OR contains({modelid}, 'inference-profile/us.') OR contains({modelid},\
      \ 'inference-profile/eu.')\\\n    \\ OR contains({modelid}, 'inference-profile/apac.')\
      \ OR contains({modelid}, 'inference-profile/us-gov.'),\\\n    \\ 'On-Demand\
      \ - Regional CRIS',\\n  contains({modelid}, ':foundation-model/'), 'On-Demand\\\
      \n    \\ - Single Region',\\n  startsWith({modelid}, 'arn:') AND NOT isNull({inferenceregion}),\\\
      \n    \\ 'On-Demand - Cross-Region (profile)',\\n  startsWith({modelid}, 'arn:'),\
      \ 'Other',\\n\\\n    \\  'On-Demand - Single Region'\\n)\"\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Capacity Model\n  Expression: \"ifelse(\\\
      n  {Traffic Type} = 'Provisioned Throughput', 'Provisioned\\\n    \\ Throughput',\\\
      n  {Traffic Type} = 'Other', 'Unclassified',\\n  'On-Demand'\\n)\"\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Service Tier\n  Expression: ifelse(isNull({service_tier}),\
      \ 'Not reported', {service_tier})\n- DataSetIdentifier: bedrock_invocations_view\n\
      \  Name: Failed Requests\n  Expression: countIf({requestid}, NOT isNull({errorcode}))\n\
      - DataSetIdentifier: bedrock_invocations_view\n  Name: Throttled Requests\n\
      \  Expression: countIf({requestid}, {errorcode} = 'ThrottlingException')\n-\
      \ DataSetIdentifier: bedrock_invocations_view\n  Name: Max Token Cutoffs\n \
      \ Expression: countIf({requestid}, {stop_reason} = 'max_tokens')\n- DataSetIdentifier:\
      \ bedrock_invocations_view\n  Name: Cache Hit Rate\n  Expression: sum(coalesce({cache_read_tokens},\
      \ 0)) / (sum(coalesce({input_tokens},\n    0)) + sum(coalesce({cache_read_tokens},\
      \ 0)) + sum(coalesce({cache_write_tokens},\n    0)))\n- DataSetIdentifier: bedrock_invocations_view\n\
      \  Name: Usage Metric Value\n  Expression: ifelse(${UsageMetric} = 'Tokens',\
      \ sum({total_tokens}), count({requestid}))\nDataSetIdentifierDeclarations:\n\
