crawlers: {}
views:
  bedrock_invocations_view:
    dependsOn:
      views:
      - bedrock_invocations_view
    data: |-
      CREATE OR REPLACE VIEW "${athena_database_name}".bedrock_invocations_view AS
      SELECT
        accountid account_id
      , accountid payer_id
      , timestamp
      , region
      , requestid
      , operation
      , modelid
      , identity_arn
      , identity
      , requestmetadata
      , year
      , month
      , day
      , input_token_count
      , input_content_type
      , output_token_count
      , output_content_type
      , usage_input_tokens
      , usage_output_tokens
      , usage_total_tokens
      , usage_cache_read_tokens
      , usage_cache_write_tokens
      , stop_reason
      , response_preview
      , prompt_preview
      FROM
        "optimization_data".bedrock_invocations_view
  bedrock_invocations_view:
    dependsOn: {}
    data: |-
      CREATE OR REPLACE VIEW "${athena_database_name}".bedrock_invocations_view AS
      SELECT
        accountid
      , CAST(from_iso8601_timestamp(timestamp) AS timestamp) timestamp
      , region
      , requestid
      , operation
      , modelid
      , identity_arn
      , IF((identity_arn LIKE '%:assumed-role/%'), element_at(split(identity_arn, '/'), -1), identity_arn) identity
      , JSON_FORMAT(CAST(requestmetadata AS JSON)) requestmetadata
      , year
      , month
      , day
      , input.inputtokencount input_token_count
      , input.inputcontenttype input_content_type
      , output.outputtokencount output_token_count
      , output.outputcontenttype output_content_type
      , TRY_CAST(json_extract_scalar(output.outputbodyjson, '$.usage.inputtokens') AS INTEGER) usage_input_tokens
      , TRY_CAST(json_extract_scalar(output.outputbodyjson, '$.usage.outputtokens') AS INTEGER) usage_output_tokens
      , TRY_CAST(json_extract_scalar(output.outputbodyjson, '$.usage.totaltokens') AS INTEGER) usage_total_tokens
      , TRY_CAST(json_extract_scalar(output.outputbodyjson, '$.usage.cachereadinputtokencount') AS INTEGER) usage_cache_read_tokens
      , TRY_CAST(json_extract_scalar(output.outputbodyjson, '$.usage.cachewriteinputtokencount') AS INTEGER) usage_cache_write_tokens
      , json_extract_scalar(output.outputbodyjson, '$.stopreason') stop_reason
      , COALESCE(json_extract_scalar(output.outputbodyjson, '$.output.message.content[0].text'), json_extract_scalar(output.outputbodyjson, '$.content[0].text'), json_extract_scalar(output.outputbodyjson, '$.completion'), json_extract_scalar(output.outputbodyjson, '$.outputtext')) response_preview
      , COALESCE(json_extract_scalar(input.inputbodyjson, '$.messages[0].content[0].text'), json_extract_scalar(input.inputbodyjson, '$.messages[0].content'), json_extract_scalar(input.inputbodyjson, '$.prompt'), json_extract_scalar(input.inputbodyjson, '$.inputtext')) prompt_preview
      FROM
        "optimization_data"."bedrock_logs"
      WHERE (from_iso8601_timestamp(timestamp) >= date_add('month', -6, current_timestamp))
