              Type: STRING
            - Name: usage_input_tokens
              Id: bedrock_i-usage_inp-db39cc
              Type: INTEGER
            - Name: usage_output_tokens
              Id: bedrock_i-usage_out-22b156
              Type: INTEGER
            - Name: usage_total_tokens
              Id: bedrock_i-usage_tot-220fc1
              Type: INTEGER
            - Name: usage_cache_read_tokens
              Id: bedrock_i-usage_cac-1a47d5
              Type: INTEGER
            - Name: usage_cache_write_tokens
              Id: bedrock_i-usage_cac-255a9f
