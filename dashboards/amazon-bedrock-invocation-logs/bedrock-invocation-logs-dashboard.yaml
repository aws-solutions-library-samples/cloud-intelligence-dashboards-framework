              Type: STRING
            - Name: operation
              Id: bedrock_i-operation-62d4aa
              Type: STRING
            - Name: modelid
              Id: bedrock_i-modelid-721a3d
              Type: STRING
            - Name: identity_arn
              Id: bedrock_i-identity_-75f9a7
              Type: STRING
            - Name: identity
              Id: bedrock_i-identity-edbcf4
              Type: STRING
            - Name: requestmetadata
              Id: bedrock_i-requestme-0594ec
              Type: STRING
            - Name: year
              Id: bedrock_i-year-3232b3
              Type: STRING
            - Name: month
