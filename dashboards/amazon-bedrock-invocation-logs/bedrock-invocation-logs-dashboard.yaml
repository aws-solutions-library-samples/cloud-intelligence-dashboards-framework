    name: Bedrock Invocation Usage Dashboard
    dashboardId: bedrock-invocation-usage-dashboard
    category: Custom
    theme: MIDNIGHT
    version: v0.0.0
    file: ./bedrock-invocation-usage-dashboard-definition.yaml
datasets:
  bedrock_invocations_view:
    data:
      DataSetId: 3c8cae3b-252e-4639-9f18-c03ebf8113a7
      Name: bedrock_invocations_view
      PhysicalTableMap:
        6904e2c8-f3c6-4781-ad85-c6709faffa94:
          RelationalTable:
            DataSourceArn: ${athena_datasource_arn}
            Catalog: AwsDataCatalog
            Schema: ${athena_database_name}
            Name: bedrock_invocations_view
            InputColumns:
            - Name: account_id
              Id: bedrock_i-account_i-4ae2b4
              Type: STRING
            - Name: payer_id
              Id: bedrock_i-payer_id-930585
              Type: STRING
            - Name: timestamp
