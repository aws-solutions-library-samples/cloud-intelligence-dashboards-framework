      DataPrepConfiguration:
        SourceTableMap:
          b219fdf4-0b40-4057-abc4-e76dfced4dd1:
            PhysicalTableId: 6904e2c8-f3c6-4781-ad85-c6709faffa94
        TransformStepMap:
          6982f59a-6f96-41d4-b73f-1b2049e9d89d:
            ImportTableStep:
              Alias: bedrock_invocations_view
              Source:
                SourceTableId: b219fdf4-0b40-4057-abc4-e76dfced4dd1
        DestinationTableMap:
          fdbea11f-9e70-4a19-a875-ce0f27631e87:
            Alias: Destination Table 1
            Source:
              TransformOperationId: 6982f59a-6f96-41d4-b73f-1b2049e9d89d
      SemanticModelConfiguration:
        TableMap:
          0fd93c6f-d169-448d-8765-e305fa2f5721:
