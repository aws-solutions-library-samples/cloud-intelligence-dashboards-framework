    SheetTextBoxId: d3ec8c30-a69c-4d5f-926f-99075ddc3cfc
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"20px\">Aurora IO Optimized\
      \ is a cluster configuration that eliminates IO charges in exchange for higher\
      \ compute (+30%) and storage (+125%) costs. It's recommended when IO costs exceed\
      \ 25% of your total Aurora cluster cost.</inline>\n  <br/>\n  <br/>\n  <inline\
      \ font-size=\"20px\">Reference Documentation and blogs:</inline>\n  <br/>\n\
      \  <ul>\n    <li class=\"ql-indent-0\">\n      <inline color=\"#56b5e0\" font-size=\"\
      20px\">\n        <a href=\"https://aws.amazon.com/blogs/aws/new-amazon-aurora-i-o-optimized-cluster-configuration-with-up-to-40-cost-savings-for-i-o-intensive-applications/\"\
      \ target=\"_blank\">Amazon Aurora I/O-Optimized cluster configuration</a>\n\
      \      </inline>\n    </li>\n    <li class=\"ql-indent-0\">\n      <inline color=\"\
      #56b5e0\" font-size=\"20px\">\n        <a href=\"https://builder.aws.com/content/2xTeU6O1MGlKSrA48Gexj7hjJZ1/aurora-io-optimized-cut-costs-for-io-intensive-workloads\"\
      \ target=\"_blank\">Aurora I/O-Optimized: Cut Costs for I/O-Intensive Workloads</a>\n\
      \      </inline>\n    </li>\n    <li class=\"ql-indent-0\">\n      <inline color=\"\
      #56b5e0\" font-size=\"20px\">\n        <a href=\"https://aws.amazon.com/rds/aurora/pricing/\"\
      \ target=\"_blank\">Aurora pricing - I/O-Optimized</a>\n      </inline>\n  \
      \  </li>\n  </ul>\n  <br/>\n  <br/>\n  <inline font-size=\"16px\">\_\u26A0\uFE0F\
      \ Estimate only - These figures are estimates to help identify potential Aurora\
      \ I/O\u2011Optimized candidates. Before converting any cluster, evaluate it\
      \ against the AWS I/O\u2011Optimized guidance and confirm the projected savings\
      \ aligned with your usage pattern. This analysis estimates the Standard \u2192\
      \ IO\u2011Optimized direction only and it does not calculate the reverse (I/O\u2011\
      Optimized \u2192 Standard).</inline>\n</text-box>"
    SheetTextBoxId: e2676de1-8db2-4cde-a14d-f7d78085253c
