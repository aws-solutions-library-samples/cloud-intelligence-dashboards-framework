            \        <b>\_</b>\n        <b>\n          <expression>Top.items[index].metricValue.formattedValue</expression>\n\
            \        </b>\n        \_DB instance\n      </li>\n    </ul>\n  </for>\n\
            \  <br/>\n  <br/>\n  <b>&#128161; Insights:</b>\n  <br/>\n  <for level=\"\
