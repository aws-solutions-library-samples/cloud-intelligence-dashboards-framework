            \    </inline>\n    <inline font-size=\"19.2px\">\_Bottom Movers for the\
            \ month of\_</inline>\n    <inline font-size=\"19.2px\">\n      <b>\n\
            \        <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \      </b>\n    </inline>\n  </if>\n  <br/>\n  <for level=\"block\" listExpression=\"\
            BottomMovers.items\">\n    <ul>\n      <li class=\"ql-indent-0\">\n  \
            \      <inline font-size=\"19.2px\">Account\_</inline>\n        <inline\
