            \      </b>\n    </li>\n    <li class=\"ql-indent-0\">\n      \_Total\
            \ number of DB Instances :\n      <b>\n        <expression>TotalAggregate.totalAggregate.formattedValue</expression>\n\
            \      </b>\n      <b>\_</b>\n    </li>\n  </ul>\n</narrative>"
