            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_to\_</inline>\n        <inline font-size=\"19.2px\">\n          <b>\n\
            \            <expression>BottomMovers.items[index].currentMetricValue.formattedAbsoluteValue</expression>\n\
            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_</inline>\n      </li>\n    </ul>\n  </for>\n  <br/>\n  <br/>\n  <br/>\n\
            </narrative>"
