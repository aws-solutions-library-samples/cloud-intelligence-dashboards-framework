            \      </b>\n    </inline>\n    <inline color=\"Accent\" font-size=\"\
            19.2px\">\n      <b>\_</b>\n    </inline>\n    <inline color=\"Accent\"\
            \ font-size=\"19.2px\">\n      <b>\n        <expression>PeriodOverPeriod.absoluteDifference.formattedValue</expression>\n\
            \      </b>\n    </inline>\n    <inline font-size=\"19.2px\">\_from\_\
