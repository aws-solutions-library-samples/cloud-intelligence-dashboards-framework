  TextBoxes:
  - Content: |-
      <text-box>
        <inline font-size="20px">
          <b>Storage Encryption Insights</b>
        </inline>
        <br/>
        <br/>
        <inline font-size="20px">RDS Storage encryption secures sensitive data at rest including databases, backups, and snapshots using industry-standard encryption algorithm. You can encrypt Amazon RDS DB instances with AWS KMS keys, either an AWS managed key or a customer managed key.</inline>
        <br/>
        <br/>
        <br/>
        <inline font-size="20px">Reference Documentation:</inline>
        <br/>
        <ul>
          <li class="ql-indent-0">
            <inline color="#56b5e0" font-size="20px">
              <a href="https://docs.aws.amazon.com/prescriptive-guidance/latest/encryption-best-practices/rds.html" target="_blank">Encryption best practices for Amazon RDS</a>
            </inline>
          </li>
          <li class="ql-indent-0">
            <inline color="#56b5e0" font-size="20px">
              <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html" target="_blank">Encrypting Amazon RDS resources</a>
            </inline>
          </li>
        </ul>
      </text-box>
    SheetTextBoxId: 6cf2deef-c0b8-4139-a3b5-fcf40fdd89aa
  - Content: |-
      <text-box>
        <inline font-size="20px">
          <b>Amazon RDS Best Practice Insights</b>
        </inline>
        <br/>
        <br/>
        <ul>
          <li class="ql-indent-0">
            <inline font-size="20px">Deploy Multi-AZ configurations for high availability with automatic failover capabilities</inline>
          </li>
          <li class="ql-indent-0">
            <inline font-size="20px">Enable storage autoscaling with appropriate thresholds to prevent capacity issues</inline>
          </li>
          <li class="ql-indent-0">
            <inline font-size="20px">Schedule maintenance windows during low-traffic periods</inline>
          </li>
          <li class="ql-indent-0">
            <inline font-size="20px">Activate performance Insights for monitoring database load and troubleshooting</inline>
          </li>
          <li class="ql-indent-0">
            <inline font-size="20px">Encrypt in transit using SSL/TLS connections with Active CA Certificates</inline>
          </li>
        </ul>
        <br/>
        <br/>
        <inline font-size="20px">Reference Documentation:</inline>
        <br/>
        <ul>
          <li class="ql-indent-0">
            <inline color="#56b5e0" font-size="20px">
              <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_BestPractices.html" target="_blank">Best practices for Amazon RDS</a>
            </inline>
          </li>
        </ul>
      </text-box>
    SheetTextBoxId: 60fd5e9c-46ad-4e09-8fac-43a2158e3d7c
  - Content: |-
      <text-box>
        <br/>
        <inline color="#f0f6f6" font-size="30px">
          <b>RDS Certification Status</b>
        </inline>
      </text-box>
    SheetTextBoxId: 76d58add-8143-4210-8ce1-8d0808fc6be1
  - Content: |-
      <text-box>
        <br/>
        <inline color="#f0f6f6" font-size="30px">
          <b>RDS Security and  Resiliency Insights</b>
        </inline>
        <br/>
        <br/>
        <inline font-size="20px">Assess your RDS fleet's security posture and high availability readiness across accounts and regions. This view surfaces gaps in encryption, certificate validity, Multi-AZ deployments, storage autoscaling, and performance monitoring, aligned with AWS Well-Architected best practices for the Reliability and Security pillars.</inline>
        <br/>
      </text-box>
