    SheetTextBoxId: 029a8c69-3da2-4d37-891e-8bb8f7dff33f
  - Content: "<text-box>\n  <inline font-size=\"32px\">&#128221;\_</inline>\n  <inline\
      \ color=\"#f0f6f6\" font-size=\"35px\">RDS Amortized Cost and Usage\_</inline>\n\
      \  <br/>\n  <br/>\n  <inline font-size=\"16px\">\n    <b>Collection Date Filter</b>\n\
      \  </inline>\n  <inline font-size=\"16px\">\_: View historical DB inventory\
      \ details by selecting a specific date</inline>\n  <br/>\n  <br/>\n  <inline\
      \ font-size=\"16px\">\n    <b>Quick Tips :</b>\n  </inline>\n  <br/>\n  <ul>\n\
      \    <li class=\"ql-indent-0\">\n      <inline font-size=\"16px\">Export the\
      \ data to CSV / Excel for detailed offline analysis</inline>\n    </li>\n  \
      \  <li class=\"ql-indent-0\">\n      <inline font-size=\"16px\">Use Athena to\
      \ query the base tables and views for custom filtering and analysis</inline>\n\
      \    </li>\n    <li class=\"ql-indent-0\">\n      <inline font-size=\"16px\"\
      >Use CUR Query Library with curated SQL queries to get started with analyzing\
      \ the Cost and Usage Report data</inline>\n    </li>\n  </ul>\n  <br/>\n  <br/>\n\
      \  <inline font-size=\"16px\">\n    <b>Additional Resources :</b>\n  </inline>\n\
      \  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">\n      <inline color=\"#56b5e0\"\
      \ font-size=\"16px\">\n        <a href=\"https://catalog.workshops.aws/cur-query-library/en-US/queries\"\
      \ target=\"_blank\">AWS Well-Architected Cost &amp; Usage Report Library</a>\n\
      \      </inline>\n    </li>\n    <li class=\"ql-indent-0\">\n      <inline color=\"\
      #56b5e0\" font-size=\"16px\">\n        <a href=\"https://docs.aws.amazon.com/athena/latest/ug/querying-athena-tables.html\"\
      \ target=\"_blank\">Athena Query Best Practices Guide</a>\n      </inline>\n\
      \    </li>\n  </ul>\n</text-box>"
