            FieldId: field-acct-ov1
            Visibility: VISIBLE
          - CustomLabel: User
            FieldId: field-user-ov1
            Visibility: VISIBLE
          - CustomLabel: Subscription Tier
            FieldId: field-tier-ov1
            Visibility: VISIBLE
          - CustomLabel: Tier Recommendation
            FieldId: field-rec-ov1
            Visibility: VISIBLE
          - CustomLabel: Plan Credits
            FieldId: field-plan-ov1
            Visibility: VISIBLE
          - CustomLabel: Credits Used
            FieldId: field-credits-ov2
            Visibility: VISIBLE
