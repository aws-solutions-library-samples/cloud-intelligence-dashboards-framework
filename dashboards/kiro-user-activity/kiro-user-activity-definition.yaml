          SmallMultiplesLimitConfiguration:
            OtherCategories: INCLUDE
      ColumnHierarchies:
      - DateTimeHierarchy:
          DrillDownFilters: []
          HierarchyId: ac825248-8570-4682-9d43-f689950f9e1d
      Subtitle:
        Visibility: VISIBLE
      Title:
        FormatText:
          RichText: |-
            <visual-title>
              <inline font-size="14px">Daily Messages by Model</inline>
            </visual-title>
