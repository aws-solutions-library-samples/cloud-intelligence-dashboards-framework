DataSetIdentifierDeclarations:
- DataSetArn: arn:aws:quicksight:::dataset/6ec4cfba-7ad1-43e2-9485-c2e027855025
  Identifier: kiro_user_activity
- DataSetArn: arn:aws:quicksight:::dataset/3d6c8f21-4b9a-4e77-8f0c-1a2b3c4d5e6f
  Identifier: kiro_cur_view
FilterGroups:
# THE BILLING PERIOD. This one control scopes everything: the activity widgets AND the
# three subscription KPIs and the idle-licence table. ALL_DATASETS works because
# usage_date exists under the same name in both kiro_user_activity and kiro_cur_view,
# which is what QuickSight matches a cross-dataset filter on.
#
# Every subscription visual is deliberately PERIOD-SCOPED, answering "who was billed in
# the selected month but consumed nothing in it?" - the question asked once per billing
# cycle when deciding which licences to reclaim. Selecting August gives August's answer
# and it never changes afterwards.
#
# WHY THE DEFAULT IS PREVIOUS MONTH. This filter group was briefly SINGLE_DATASET,
# cutting the kiro_cur_view visuals loose from the picker and measuring idleness as a
# fixed 30 days from now(), because a window-scoped subscription roster broke badly:
# measured on real data on 2026-09-08, Total Kiro Subscriptions read 1 of 29 on
# month-to-date. The cause was the PARTIAL month, not the picker. Kiro fee lines are
# dated either on the 1st (month-anchored) or through month end (daily-prorated, i.e.
# future-dated relative to today), and CUR delivery lag means the current month's fee
# lines may not have landed at all yet - so 28 of 29 subscriptions had no billing row
# anywhere inside a window ending today.
#
# Over a COMPLETE calendar month every line shape falls inside the window: fees on the
# 1st, prorated fees through month end, and credits lines on the actual day of
# consumption. Line-date scoping and billing-period scoping therefore agree for a whole
# month, which is why no bill_billing_period_start_date column is needed in the view.
#
# A PARTIAL window still reads low, and the dashboard CANNOT prevent one from being
# selected. MinimumGranularity: MONTH was tried and QuickSight rejects it outright -
# "Filter only supports [DAY, HOUR, MINUTE] as minimum granularity" from UpdateDashboard -
# so day-grain windows are always offered whether or not they make sense here. The only
# defences are therefore soft: RelativeDateType PREVIOUS opens the dashboard on the most
# recent fully delivered bill, and the text box on every sheet says to pick a whole
# calendar month. Selecting the current month is legitimate, it just shows a bill still
# being written.
#
# CONSEQUENCE FOR ANYONE EDITING THE kiro_cur_view CALCULATED FIELDS: because this
# control reaches that dataset, its window functions must be PRE_AGG, which is evaluated
# AFTER filters. A PRE_FILTER window is invisible to this control by definition and would
# silently ignore the billing period. See period_credits / period_fees.
- CrossDataset: ALL_DATASETS
  FilterGroupId: fg-date-global
  Filters:
  - RelativeDatesFilter:
      AnchorDateConfiguration:
        AnchorOption: NOW
      Column:
        ColumnName: usage_date
        DataSetIdentifier: kiro_user_activity
      DefaultFilterControlConfiguration:
        ControlOptions:
          DefaultRelativeDateTimeOptions:
            DisplayOptions:
              TitleOptions:
                FontConfiguration:
                  FontSize:
                    Relative: MEDIUM
                Visibility: VISIBLE
        Title: Billing period
      FilterId: filter-date
      MinimumGranularity: DAY
      NullOption: NON_NULLS_ONLY
      RelativeDateType: PREVIOUS
      TimeGranularity: MONTH
  ScopeConfiguration:
    AllSheets: {}
  Status: ENABLED
# ALL_DATASETS, not SINGLE_DATASET: account_id and user_email exist under the same
# names in both kiro_user_activity and kiro_cur_view, so a cross-dataset filter
# scopes the subscription KPIs and the idle-licence table too. As SINGLE_DATASET
# these controls silently did nothing to those visuals - picking one AWS Account
# still listed idle licences from every account.
#
# These two stay cross-dataset while fg-date-global above is deliberately
# SINGLE_DATASET, and the difference is intentional: narrowing to an account or a
# person narrows WHICH licences you are asking about, which every visual should
# honour, whereas narrowing the date range would change what "idle" MEANS for the
# CUR visuals, which is the thing that made them contradict the table.
- CrossDataset: ALL_DATASETS
