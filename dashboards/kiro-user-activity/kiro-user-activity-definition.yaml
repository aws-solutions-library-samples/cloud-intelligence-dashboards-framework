CalculatedFields:
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse({monthly_plan_credits} > 0 AND {monthly_plan_utilization_pct} >= 0.75, 1, 0)
  Name: at_risk_flag
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse({monthly_plan_credits} > 0 AND {monthly_plan_utilization_pct} < 0.25, 1,
    0)
  Name: underutilized_flag
- DataSetIdentifier: kiro_user_activity
  Expression: maxOver({plan_credits}, [{userid}, truncDate("MM", {usage_date})], PRE_AGG)
  Name: monthly_plan_credits
- DataSetIdentifier: kiro_user_activity
  Expression: >-
    ifelse(
      {monthly_plan_credits} = 10000, 'POWER',
      {monthly_plan_credits} = 5000, 'PRO_MAX',
      {monthly_plan_credits} = 2000, 'PRO_PLUS',
      {monthly_plan_credits} = 1000, 'PRO',
      {monthly_plan_credits} = 50, 'FREE',
      'Unknown Tier'
    )
  Name: monthly_tier
- DataSetIdentifier: kiro_user_activity
  Expression: replace(replace(replace(toLower({monthly_tier}), '_', ''), '-', ''), ' ', '')
  Name: monthly_tier_key
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse({monthly_plan_credits} > 0, sumOver({credits_used_num}, [userid, truncDate("MM",
    {usage_date})], PRE_AGG) / {monthly_plan_credits}, 0)
  Name: monthly_plan_utilization_pct
- DataSetIdentifier: kiro_user_activity
  Expression: sumOver({overage_credits_used_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG)
  Name: monthly_overage_credits
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse(sumOver({total_messages_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG) > 0, sumOver({credits_used_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG) / sumOver({total_messages_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG), 0)
  Name: monthly_credits_per_message
- DataSetIdentifier: kiro_user_activity
  Expression: >-
    ifelse(
      {monthly_plan_credits} = 0, 'Unknown Tier',
      {monthly_overage_credits} > 0,
        ifelse({monthly_tier_key} = 'power', 'Review Overage Settings', 'Upgrade Candidate'),
      {monthly_plan_utilization_pct} < 0.3 AND {monthly_tier_key} <> 'pro' AND {monthly_tier_key} <> 'free',
        'Downgrade Candidate',
      'Right-Sized'
    )
  Name: tier_recommendation_monthly
- DataSetIdentifier: kiro_cur_view
  Expression: concat({account_id}, '|', {resource_id})
  Name: subscription_key
- DataSetIdentifier: kiro_cur_view
  Expression: sumOver(ifelse(toLower({operation}) = 'monthly-subscription', {unblended_cost}, 0), [{account_id},
    {resource_id}], PRE_AGG)
  Name: period_subscription_cost
- DataSetIdentifier: kiro_cur_view
  Expression: maxOver(ifelse((toLower({operation}) = 'credits' AND {usage_quantity} > 0) OR {activity_credits}
    > 0, 1, 0), [{account_id}, {resource_id}], PRE_AGG)
  Name: period_active_flag
- DataSetIdentifier: kiro_cur_view
  Expression: ifelse({period_total_cost} > 0 AND {period_active_flag} = 0, 1, 0)
  Name: inactive_in_period
- DataSetIdentifier: kiro_cur_view
  Expression: sumOver({unblended_cost}, [{account_id}, {resource_id}], PRE_AGG)
  Name: period_total_cost
- DataSetIdentifier: kiro_cur_view
  Expression: ifelse(toLower({operation}) = 'credits', {unblended_cost}, 0)
  Name: overage_cost
- DataSetIdentifier: kiro_cur_view
  Expression: maxOver(ifelse(toLower({operation}) = 'credits' AND {usage_quantity} > 0, {usage_date},
    {activity_credits} > 0, {activity_last_date}, NULL), [{account_id}, {resource_id}], PRE_FILTER)
  Name: last_activity_date
- DataSetIdentifier: kiro_cur_view
  Expression: truncDate("MM", minOver({usage_date}, [], PRE_AGG))
  Name: period_start
- DataSetIdentifier: kiro_cur_view
  Expression: addDateTime(-1, "DD", addDateTime(1, "MM", truncDate("MM", maxOver({usage_date},
    [], PRE_AGG))))
  Name: period_end
- DataSetIdentifier: kiro_cur_view
  Expression: minOver(ifelse(toLower({operation}) = 'monthly-subscription', {usage_date}, NULL), [{account_id},
    {resource_id}], PRE_FILTER)
  Name: first_billed_date
- DataSetIdentifier: kiro_cur_view
  Expression: distinctCountOver(ifelse(toLower({operation}) = 'monthly-subscription', truncDate("MM", {usage_date}),
    NULL), [{account_id}, {resource_id}], PRE_AGG)
  Name: billed_months_in_period
- DataSetIdentifier: kiro_cur_view
  Expression: ifelse({billed_months_in_period} > 0, {period_subscription_cost} / {billed_months_in_period},
    0)
  Name: monthly_fee
- DataSetIdentifier: kiro_cur_view
  Expression: >-
    ifelse(
      isNull({last_activity_date}), dateDiff(truncDate("MM", {first_billed_date}), truncDate("MM", {period_end}), "MM") + 1,
      {last_activity_date} < {first_billed_date}, dateDiff(truncDate("MM", {first_billed_date}), truncDate("MM", {period_end}), "MM") + 1,
      {last_activity_date} > {period_end}, {months_in_period},
      dateDiff(truncDate("MM", {last_activity_date}), truncDate("MM", {period_end}), "MM")
    )
  Name: months_idle
- DataSetIdentifier: kiro_cur_view
  Expression: dateDiff(truncDate("MM", {period_start}), truncDate("MM", {period_end}), "MM")
    + 1
  Name: months_in_period
- DataSetIdentifier: kiro_cur_view
  Expression: '{monthly_fee} * {months_idle}'
  Name: inactivity_cost
- DataSetIdentifier: kiro_cur_view
  Expression: dateDiff(truncDate("MM", {first_billed_date}), truncDate("MM", {period_end}),
    "MM") + 1
  Name: months_licensed
- DataSetIdentifier: kiro_cur_view
  Expression: ifelse({months_licensed} - {months_idle} > 0, {months_licensed} - {months_idle},
    0)
  Name: months_active
