  - PivotTableVisual:
      # Inactive Kiro subscribers, sourced from kiro_cur_view (the authoritative
      # subscription roster from CUR). Scoped by fg-kiro-inactive-users-table to
      # inactive_in_period = 1: billed in the selected Billing period, consumed no
      # credits in it. Selecting August lists August's reclaim candidates, and that
      # answer is computed from August's rows so it does not drift over time.
      #
      # Last Activity / Days Idle are the ALL-TIME fields, deliberately: they are
      # PRE_FILTER so they ignore the billing period. A licence idle in August that
      # came back to life in September shows a September Last Activity, which is the
      # context that stops someone reclaiming a licence now back in use. Both take the
      # newest 'Kiro Enterprise Credits' line per account + subscription. Verified in
      # Athena: those Credits lines carry the real day of consumption and match the
      # activity dataset's last active date exactly, and CUR also covers accounts whose
      # Kiro activity report is not collected.
      #
      # user_email is resolved via the same join; it falls back to the resource_id
      # UUID when the user has never generated activity (see manifest comment).
      # Rendered as a pivot so account_id groups (collapsible) and the whole
      # table can be sorted by account or cost.
      Actions: []
      ChartConfiguration:
        FieldOptions:
          SelectedFieldOptions:
          - CustomLabel: Account
            FieldId: field-inactive-account
            Visibility: VISIBLE
          - CustomLabel: User
            FieldId: field-inactive-user
            Visibility: VISIBLE
          - CustomLabel: Subscription Type
            FieldId: field-inactive-subtype
            Visibility: VISIBLE
          # Columns read as a narrative: how long they have been on the tool, then how
          # long they have been off it, then what that has cost.
          #
          # Licence Since and Last Activity are all-time and so can fall outside the
          # selected period. Days Idle is measured TO THE END of the selected period, so
          # it does move with the control even though its starting point does not.
          - CustomLabel: Licence Since
            FieldId: field-inactive-licence-since
            Visibility: VISIBLE
          - CustomLabel: Last Activity (all-time)
            FieldId: field-inactive-last-activity
            Visibility: VISIBLE
          - CustomLabel: Months Active
            FieldId: field-inactive-months-active
            Visibility: VISIBLE
          - CustomLabel: Days Idle at Period End
            FieldId: field-inactive-days-idle
            Visibility: VISIBLE
          # Inactivity Cost is the number to act on, so it sits last, closest to
          # the eye, with its own two factors immediately before it: Months Idle x
          # Monthly Fee. Showing the factors means nobody has to trust the total.
          #
          # Named for what it measures rather than for a verdict on it. "Wasted" reads
          # as an accusation in a review with the licence holder's manager, and the
          # dashboard cannot actually know whether the spend was justified.
          - CustomLabel: Months Idle
            FieldId: field-inactive-months-idle
            Visibility: VISIBLE
          - CustomLabel: Monthly Fee
            FieldId: field-inactive-cost
            Visibility: VISIBLE
          - CustomLabel: Inactivity Cost
            FieldId: field-inactive-unused-cost
            Visibility: VISIBLE
        FieldWells:
          PivotTableAggregatedFieldWells:
            Columns: []
            Rows:
            - CategoricalDimensionField:
                Column:
                  ColumnName: account_id
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-account
            - CategoricalDimensionField:
                Column:
                  ColumnName: user_email
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-user
            - CategoricalDimensionField:
                Column:
                  ColumnName: subscription_type
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-subtype
            Values:
            # Every field below is a window function partitioned by account_id +
            # resource_id, so each returns the same value on every CUR row for that
            # subscription. They MUST aggregate with MIN or MAX - SUM would multiply the
            # value by the subscription's row count. MIN on the "first" date and MAX on
            # the "last" one purely so the intent reads correctly; on a constant the two
            # are equivalent.
            - DateMeasureField:
                AggregationFunction: MIN
                Column:
                  ColumnName: first_billed_date
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-licence-since
                FormatConfiguration:
                  DateTimeFormat: YYYY-MM-DD
                  NullValueFormatConfiguration:
                    NullString: '-'
            - DateMeasureField:
                AggregationFunction: MAX
                Column:
                  ColumnName: last_activity_date
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-last-activity
                FormatConfiguration:
                  # Display formats use moment.js tokens, which are case
                  # sensitive and differ from the Java-style pattern accepted by
                  # parseDate() in the dataset. Lowercase yyyy-MM-dd renders as
                  # "yyyy-03-Th": yyyy is not a token so it passes through
                  # literally, and dd is the minimal day-of-week name, not the
                  # day of month. Year is YYYY and day of month is DD.
                  DateTimeFormat: YYYY-MM-DD
                  NullValueFormatConfiguration:
                    NullString: No activity on record
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: MAX
                Column:
                  ColumnName: months_active
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-months-active
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 0
                      NullValueFormatConfiguration:
                        NullString: '-'
                      SeparatorConfiguration: {}
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: MAX
                Column:
                  ColumnName: days_idle
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-days-idle
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 0
                      NullValueFormatConfiguration:
                        NullString: '-'
                      SeparatorConfiguration: {}
            # The two factors of Inactivity Cost, so the total below is checkable
            # by eye. Both are per-licence window values, hence MAX.
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: MAX
                Column:
                  ColumnName: months_idle
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-months-idle
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 0
                      SeparatorConfiguration: {}
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: MAX
                Column:
                  ColumnName: monthly_fee
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-cost
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 2
                      Prefix: $
                      SeparatorConfiguration: {}
            # MAX, not SUM: inactivity_cost is a per-licence figure rather
            # than a per-row cost, so SUM would multiply it by the licence's CUR row
            # count - roughly 30x for a daily-prorated subscription.
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: MAX
                Column:
                  ColumnName: inactivity_cost
                  DataSetIdentifier: kiro_cur_view
                FieldId: field-inactive-unused-cost
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 2
                      Prefix: $
                      SeparatorConfiguration: {}
        SortConfiguration:
          FieldSortOptions:
          - FieldId: field-inactive-account
            SortBy:
              Field:
                Direction: ASC
                FieldId: field-inactive-account
          # Within an account, stalest subscriptions first - those are the ones
          # worth reclaiming.
          - FieldId: field-inactive-user
            SortBy:
              Field:
                Direction: DESC
                FieldId: field-inactive-days-idle
        TableOptions:
          CellStyle: {}
          ColumnHeaderStyle: {}
          RowFieldNamesStyle: {}
      Subtitle:
        FormatText:
          RichText: |-
            <visual-subtitle>
              &#128269; Billed in the selected billing period with no credit usage in it. Matches the Idle Kiro Licences KPI.
              <br/>
              &#128336; Months Active is how long they used Kiro before going quiet - weigh it against the idle columns before acting.
              <br/>
              &#8987; Days Idle and Months Idle both run to the last day of the selected period.
              <br/>
              &#10134; A blank Last Activity means the licence was never used; Months Idle then counts from its first charge.
              <br/>
              &#128176; Inactivity Cost = Months Idle x Monthly Fee, valued at the current fee.
            </visual-subtitle>
        Visibility: VISIBLE
      Title:
        FormatText:
          RichText: "<visual-title>\n  <inline font-size=\"14px\">Idle Kiro Licences\
            \ - billed in the selected period with no credit usage in it</inline>\n\
            </visual-title>"
        Visibility: VISIBLE
      VisualId: table-inactive-users
