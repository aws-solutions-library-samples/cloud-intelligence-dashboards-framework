  TextBoxes:
  - Content: |-
      <text-box>
        &#128197; Kiro bills per calendar month - plans and credit allowances reset on the 1st.
        <br/>
        &#128270; Billing period scopes every widget here and opens on the previous month. Use whole months.
        <br/>
        &#128336; Licence Since and Months Active come from billing data, retained for 18 months - read Months Active as a minimum, not an exact tenure.
        <br/>
        &#128161; Weigh Months Active against the idle figures: a year of use then two quiet months is not the same case as a licence barely touched since purchase.
      </text-box>
