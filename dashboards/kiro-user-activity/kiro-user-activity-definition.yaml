            FieldId: field-util-ov1
            Visibility: VISIBLE
          - CustomLabel: Overage Credits Used
            FieldId: field-overage-ov2
            Visibility: VISIBLE
        FieldWells:
          PivotTableAggregatedFieldWells:
            Columns: []
            Rows:
            # Outermost row, at MONTH granularity, so the title's "Monthly" is
            # actually true. Without it the SUMs below covered the entire selected
            # lookback while MIN(monthly_plan_utilization_pct) is scoped to one
            # calendar month, so on any multi-month window Credits Used and Plan
            # Utilization described different periods on the same row. Kiro bills
            # per calendar month, so the month is the unit that matters here.
            - DateDimensionField:
                Column:
                  ColumnName: usage_date
                  DataSetIdentifier: kiro_user_activity
                DateGranularity: MONTH
                FieldId: field-month-ov1
            - CategoricalDimensionField:
                Column:
                  ColumnName: account_id
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-acct-ov1
            - CategoricalDimensionField:
                Column:
                  ColumnName: user
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-user-ov1
            - CategoricalDimensionField:
                Column:
                  ColumnName: subscription_tier
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-tier-ov1
            - CategoricalDimensionField:
                Column:
                  ColumnName: tier_recommendation_monthly
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-rec-ov1
            Values:
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: MAX
                Column:
                  ColumnName: plan_credits
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-plan-ov1
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 0
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: SUM
                Column:
                  ColumnName: credits_used_num
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-credits-ov2
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 0
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: MIN
                Column:
                  ColumnName: monthly_plan_utilization_pct
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-util-ov1
                FormatConfiguration:
                  FormatConfiguration:
                    PercentageDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 1
                      Suffix: '%'
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: SUM
                Column:
                  ColumnName: overage_credits_used_num
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-overage-ov2
                FormatConfiguration:
                  FormatConfiguration:
                    NumberDisplayFormatConfiguration:
                      DecimalPlacesConfiguration:
                        DecimalPlaces: 0
        SortConfiguration:
          FieldSortOptions:
          - FieldId: field-user-ov1
            SortBy:
              Field:
                Direction: DESC
                FieldId: field-util-ov1
        TableOptions:
          CellStyle: {}
          ColumnHeaderStyle: {}
          RowFieldNamesStyle: {}
      ConditionalFormatting:
        ConditionalFormattingOptions:
        - Cell:
            FieldId: field-util-ov1
            Scopes:
            - Role: FIELD
            TextFormat:
              TextColor:
                Solid:
                  Color: '#DE3B00'
                  # Must match the cell it colours, which is MIN(monthly_plan_utilization_pct),
                  # and must match at_risk_flag's threshold, which is >= 0.75. It was
                  # `> 0.75`, so a user sitting exactly on 75% was flagged at risk by the
                  # KPI but left uncoloured here. The minOver(...) window was redundant:
                  # monthly_plan_utilization_pct already sums credits over exactly
                  # [userid, month], so re-partitioning it on the same keys returned itself.
                  Expression: min({monthly_plan_utilization_pct}) >= 0.75
      Subtitle:
        Visibility: VISIBLE
      Title:
        FormatText:
          RichText: |-
            <visual-title>
              <inline font-size="14px">Monthly Credits and Overage by User</inline>
            </visual-title>
        Visibility: VISIBLE
