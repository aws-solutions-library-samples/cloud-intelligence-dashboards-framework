  # RowSpan 4 allotted above; if a line is added, grow that span or something clips.
  - Content: |-
      <text-box>
        &#128197; Kiro bills per calendar month - plans and credit allowances reset on the 1st.
        <br/>
        &#128270; Billing period scopes every widget here and opens on the previous month. Use whole months; partial windows understate usage and can miss billing lines.
        <br/>
        &#128179; From billing: Total = licences billed in the period, Active = consumed credits, Idle = billed but unused. Active + Idle = Total.
        <br/>
        &#128100; From the activity report: Active Users, Total Messages, Credits Used, Overage Credits. A different population from the licence counts, so they will not tie.
      </text-box>
