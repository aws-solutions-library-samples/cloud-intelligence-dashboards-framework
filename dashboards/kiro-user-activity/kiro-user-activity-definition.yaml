        <inline font-size="54.88px">Notices</inline>
        <br/>
        <br/>
        <inline font-size="22.4px">Customers are responsible for making their own independent assessment of this dashboard and its content. This dashboard and its content: (a) is for informational purposes only, (b) represents current AWS product offerings and practices, which are subject to change without notice, and (c) does not create any commitments or assurances from AWS and its affiliates, suppliers or licensors. AWS content, products or services are provided "as is" without warranties, representations, or conditions of any kind, whether express or implied. The responsibilities and liabilities of AWS to its customers are controlled by AWS agreements, and this document is not part of, nor does it modify, any agreement between AWS and its customers.</inline>
      </text-box>
    SheetTextBoxId: 8982dad8-c41f-45be-a383-2a662eeacbac
  # Center-aligned dashboard name / version block, mirroring CUDOS v5 (40px,
  # teal #61d1d6 name).
  #
  # KEEP THIS VERSION IN SYNC WITH `version:` IN kiro-user-activity.yaml. Nothing
  # templates it - every dashboard in this repo hardcodes its About version - so it
  # silently drifts on a release. It was left at v1.0.0 through the v1.1.0 release.
  - Content: |-
      <text-box>
        <block align="center">
          <inline color="#61d1d6" font-size="40px"><b>Kiro User Activity Dashboard</b></inline>
        </block>
        <br/>
        <block align="center">
          <inline font-size="40px"><b>v1.1.0</b></inline>
        </block>
      </text-box>
    SheetTextBoxId: fdd229b0-07cb-4b93-b634-0a2357c4b4b1
  # Right-aligned footer credits, mirroring CUDOS v5.
  - Content: |-
      <text-box>
        <block align="right">Built by: Darius, Yuriy Prykhodko</block>
        <br/>
        <block align="right">Learn more about AWS Cloud Intelligence Dashboards (CID) on <inline color="#61d1d6"><a href="https://docs.aws.amazon.com/guidance/latest/cloud-intelligence-dashboards/getting-started.html" target="_blank"><u>AWS Well-Architected Labs</u></a></inline></block>
        <br/>
        <block align="right">Powered by: Amazon QuickSight, Amazon Athena</block>
      </text-box>
    SheetTextBoxId: a6e4980b-1629-4c09-8a27-d003e813f20a
