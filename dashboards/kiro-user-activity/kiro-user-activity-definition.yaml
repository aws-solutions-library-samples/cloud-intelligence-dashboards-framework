CalculatedFields:
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse({monthly_plan_utilization_pct} >= 0.75, 1, 0)
  Name: at_risk_flag
# The mirror image of at_risk_flag, for the "Users Below 25% of Plan" KPI that sits
# beside it. Both read the same MONTHLY utilization figure, so the two counts are
# directly comparable and the thresholds cannot drift apart.
#
# The plan_credits > 0 guard is required and is NOT symmetric with at_risk_flag.
# monthly_plan_utilization_pct returns 0 when the tier is unrecognised (plan_credits
# = 0 means the tier ladder in the dataset has no entry for it), and a 0 fails the
# >= 0.75 test harmlessly - an unknown tier simply never counts as at risk. Here 0
# would PASS the < 0.25 test, so without the guard every user on a tier the dashboard
# does not know about would be reported as under-using an allowance nobody knows.
#
# Free tier is deliberately included: 50 credits is a real known allowance, and the
# purpose of this KPI per the customer is to hand managers a list of people who are
# not using the tool, which is a question about people rather than about cost. What to
# DO about it is the job of tier_recommendation_monthly, which does exclude the tiers
# with no smaller plan to move to.
#
# KNOWN CAVEAT, inherited from monthly_plan_utilization_pct: with the Model control
# narrowed to a single model, PRE_AGG sees only that model's rows, and the source
# report writes credits_used on just one model row per user-day. Utilization then
# reads near 0 and this KPI OVER-counts. at_risk_flag has the same root cause but
# fails safe by under-counting. Read this KPI with Model set to all values.
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse({plan_credits} > 0 AND {monthly_plan_utilization_pct} < 0.25, 1,
    0)
  Name: underutilized_flag
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse({plan_credits} > 0, sumOver({credits_used_num}, [userid, truncDate("MM",
    {usage_date})], PRE_AGG) / {plan_credits}, 0)
  Name: monthly_plan_utilization_pct
- DataSetIdentifier: kiro_user_activity
  Expression: sumOver({overage_credits_used_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG)
  Name: monthly_overage_credits
# A ratio must be divided AFTER summing, so both sides are summed over the same
# [userid, month] partition here rather than aggregated in the field well. The
# dataset column credits_per_message CANNOT be used for this: it is per row, this
# dataset is one row per user per day per MODEL, and the source report writes
# credits_used on only ONE of those model rows (zero on the rest), so averaging it
# divides a real ratio by the model-row count. Measured on 2026-09-08,
# AVERAGE(credits_per_message) read 0.161 dataset-wide against a true
# SUM(credits)/SUM(messages) of 0.388, understated 2.4x.
#
# Constant within a user-month by construction, so the field wells take MIN of it,
# exactly as they do for monthly_plan_utilization_pct. PRE_AGG for the same reason
# and with the same caveat: it sees only rows surviving the row-level filters, so
# filtering to a single Model can exclude the credits carrier row and read 0.
- DataSetIdentifier: kiro_user_activity
  Expression: ifelse(sumOver({total_messages_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG) > 0, sumOver({credits_used_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG) / sumOver({total_messages_num}, [userid, truncDate("MM", {usage_date})],
    PRE_AGG), 0)
  Name: monthly_credits_per_message
# Tier right-sizing based on MONTHLY utilization (Kiro bills per calendar month).
# Ladder: Pro (1k) < ProPlus (2k) < ProMax (5k) < Power (10k).
#  - Any overage this month => plan too small. Not on Power => Upgrade Candidate.
#    Already on Power (top tier, no upgrade path) => Review Overage Settings, since
#    the only remaining lever is the overage cap, not a bigger plan.
#  - Consistently low monthly utilization (<30%) and not already on the smallest
#    plan (Pro) => Downgrade Candidate.
#  - Otherwise Right-Sized.
- DataSetIdentifier: kiro_user_activity
  Expression: >-
    ifelse(
      {monthly_overage_credits} > 0,
        ifelse(toLower({subscription_tier}) = 'power', 'Review Overage Settings', 'Upgrade Candidate'),
      {monthly_plan_utilization_pct} < 0.3 AND toLower({subscription_tier}) <> 'pro' AND toLower({subscription_tier}) <> 'free',
        'Downgrade Candidate',
      'Right-Sized'
    )
  Name: tier_recommendation_monthly
# One Kiro licence = one resource_id IN ONE ACCOUNT. The same person (one
# Identity Center resource_id) subscribed in two accounts is billed twice and holds
# two licences, either of which can be idle and reclaimable independently, so the
# unit of counting has to be the pair. DISTINCT_COUNT({resource_id}) alone would
# collapse those two licences into one and hide the wasted spend. Verified against
# real data: 29 distinct resource_ids but 30 account+resource_id licences.
- DataSetIdentifier: kiro_cur_view
  Expression: concat({account_id}, '|', {resource_id})
  Name: subscription_key
# THE TWO PERIOD-SCOPED FIELDS BELOW ARE THE ACTIVE/INACTIVE TEST. Both are PRE_AGG,
# which is evaluated AFTER filters, so both see exactly the rows inside the Billing
# period the user selected (see fg-date-global). That is the whole point: "inactive in
# August" has to be answered from August's rows and nothing else.
#
# PRE_FILTER would be wrong here - it is evaluated BEFORE filters, so it cannot see the
# billing period at all. An earlier revision used PRE_FILTER precisely because the test
# it was expressing then ("idle for 30 days as of today") was an out-of-window question.
# Now that the question is entirely within-period, PRE_AGG is the correct level. Do not
# "fix" these to PRE_FILTER: it silently detaches them from the date picker.
#
# Partitioned by account_id AND resource_id, not resource_id alone: a subscription is
# billed per account, so someone subscribed in two accounts but only working in one has
# a genuinely idle subscription in the other. Partitioning on resource_id alone would
# let the active account mask the wasted subscription.
#
# period_fees is what a licence was CHARGED in the selected period, and it replaces the
# old months_since_last_bill guard. "Was this licence billed in the month I am looking
# at?" is both a sharper question than "was it billed recently?" and the one that keeps
# cancelled licences out of the roster automatically - no <= 1 month fudge factor.
# Excludes Credits lines so that a licence which somehow consumed credits without being
# billed a fee cannot masquerade as a subscription.
- DataSetIdentifier: kiro_cur_view
  Expression: sumOver(ifelse({pricing_unit} <> 'Credits', {unblended_cost}, 0), [{account_id},
    {resource_id}], PRE_AGG)
  Name: period_fees
# Credits actually consumed in the selected period. Only pricing_unit='Credits' with a
# positive quantity means "the user did something": fee lines are dated by billing
# convention (on the 1st, or every day through month end) rather than by when anyone
# worked, so their presence says nothing at all about activity.
- DataSetIdentifier: kiro_cur_view
  Expression: sumOver(ifelse({pricing_unit} = 'Credits' AND {usage_quantity} > 0, {usage_quantity},
    0), [{account_id}, {resource_id}], PRE_AGG)
  Name: period_credits
# Billed in the selected period, consumed nothing in it. This is the definition the
# dashboard acts on, and it is deliberately self-contained per month: August's answer is
# computed from August's rows, so it does not drift as time passes or as new data lands.
#
# A licence with no fee line in the period is neither active nor inactive - it is not on
# this month's bill and so is not part of the roster at all (see period_fees).
- DataSetIdentifier: kiro_cur_view
  Expression: ifelse({period_fees} > 0 AND {period_credits} = 0, 1, 0)
  Name: inactive_in_period
# ALL-TIME staleness, for the two informational columns in the idle table. These two are
# PRE_FILTER on purpose and are the ONLY fields here that ignore the billing period: the
# question they answer is "when did this person last do anything, ever?", which is what
# makes an idle licence in August worth chasing today. A licence inactive in August that
# came back to life in September shows Last Activity in September, and that context is
# the point - it stops someone reclaiming a licence that is now in use.
#
# Verified in Athena against real subscription data: for every subscription present in
# both sources this matches the activity dataset's last active date exactly, and CUR
# additionally covers accounts whose activity report is not collected.
- DataSetIdentifier: kiro_cur_view
  Expression: maxOver(ifelse({pricing_unit} = 'Credits' AND {usage_quantity} > 0,
    {usage_date}, NULL), [{account_id}, {resource_id}], PRE_FILTER)
  Name: last_activity_date
# THE BOUNDS OF THE SELECTED BILLING PERIOD, recovered from the data rather than from the
# filter. QuickSight gives an expression no way to read a filter's start and end dates, so
# these take the min and max usage_date among the rows that SURVIVED the filter (PRE_AGG,
# empty partition = across the whole filtered dataset) and round out to whole calendar
# months. Rounding is what makes them stable: for a one-month selection the answer is that
# month's 1st and last day no matter which fee-line shape the licences use or which
# Account / User is selected, even though the raw min and max move around.
#
# The honest limitation: these describe the period AS COVERED BY DATA, not the literal
# filter bounds. Selecting "This year" in September yields 1 Jan to 30 Sep, not 31 Dec,
# because no later rows exist yet. For the whole-month selections this dashboard is built
# around, which is what the text boxes ask for, the two coincide.
#
# The alternative was a pair of date parameters plus their own controls, which would have
# meant a second date picker on every sheet. Reconsider that if the literal bounds ever
# matter more than having one control.
- DataSetIdentifier: kiro_cur_view
  Expression: truncDate("MM", minOver({usage_date}, [], PRE_AGG))
  Name: period_start
- DataSetIdentifier: kiro_cur_view
  Expression: addDateTime(-1, "DD", addDateTime(1, "MM", truncDate("MM", maxOver({usage_date},
    [], PRE_AGG))))
  Name: period_end
- DataSetIdentifier: kiro_cur_view
  Expression: dateDiff({period_start}, {period_end}, "DD") + 1
  Name: period_days
# Days idle AS AT THE END OF THE SELECTED PERIOD, not as at today. Looking at August has
# to give August's answer, and a figure measured from now() silently grew every day and
# reported the same number whichever month you were reviewing.
#
# Three branches:
#  1. Never consumed credits in any period -> the full length of the period. This is the
#     case that used to render as an empty cell, because dateDiff on a NULL date is NULL:
#     the licences with NOTHING on record, the most reclaimable ones, were the only ones
#     showing no number at all. The period length is a floor, not the true figure - the
#     licence has been idle at least this long - and it is the most that can be said from
#     the selected period alone.
#  2. Active AFTER the period ended -> the full length of the period, the same floor as
#     branch 1. This happens whenever a licence idle in August comes back to life in
#     September, because last_activity_date is all-time. Measured on real data for
#     dseroka+dariusjs@amazon.com in account 654654305283, reviewing August: Last Activity
#     read 2026-09-04, later than the 31 August period end.
#
#     This branch returned 0 first, to avoid the negative number a raw dateDiff would give.
#     That was wrong, and provably so from the row itself: the licence is ON this table,
#     which means it consumed no credits in the whole selected period, so it cannot have
#     been idle for zero days. It also made Inactivity Cost read 0.00 for a month that was
#     genuinely paid for and unused, and pushed Months Active to the full licensed life.
#
#     The exact figure - days since the last activity ON OR BEFORE the period end - is not
#     reachable here. It needs a window over rows the Billing period filter has already
#     removed, and a PRE_FILTER window cannot be used because period_end is itself PRE_AGG,
#     evaluated after filters. Only a date parameter would give it, at the price of a second
#     date control. The period length is exact for the period and a floor for all time,
#     which is the honest reading and never contradicts the row's presence in the table.
#  3. Otherwise the days from the last activity to the end of the period.
- DataSetIdentifier: kiro_cur_view
  Expression: >-
    ifelse(
      isNull({last_activity_date}), {period_days},
      {last_activity_date} > {period_end}, {period_days},
      dateDiff({last_activity_date}, {period_end}, "DD")
    )
  Name: days_idle
# The first day this licence was ever charged a fee, PRE_FILTER so it reaches back past
# the selected period into the full 18 months the view holds. Needed for a licence that
# has NEVER consumed credits: there is no last-activity date to count idle months from, so
# the count runs from the day the money started going out instead.
#
# Credits lines are excluded, same as period_fees - a fee is what makes a licence cost
# something, and it is fees that get wasted.
- DataSetIdentifier: kiro_cur_view
  Expression: minOver(ifelse({pricing_unit} <> 'Credits', {usage_date}, NULL), [{account_id},
    {resource_id}], PRE_FILTER)
  Name: first_billed_date
# How many distinct calendar months this licence was charged a fee in, WITHIN the selected
# period. This is the divisor that turns period_fees into a monthly rate.
#
# Counting billed months rather than using period_days is what makes the rate correct for
# a multi-month selection: a licence billed in only 2 months of a 9-month window has its
# fee divided by 2, not by 9, so the monthly figure is the real monthly figure.
- DataSetIdentifier: kiro_cur_view
  Expression: distinctCountOver(ifelse({pricing_unit} <> 'Credits', truncDate("MM", {usage_date}),
    NULL), [{account_id}, {resource_id}], PRE_AGG)
  Name: billed_months_in_period
# What this licence costs per month, derived from what it was ACTUALLY charged rather than
# from a hardcoded price ladder - so tier changes, discounts and private pricing are all
# picked up automatically, and nothing has to be maintained when Kiro changes its prices.
- DataSetIdentifier: kiro_cur_view
  Expression: ifelse({billed_months_in_period} > 0, {period_fees} / {billed_months_in_period},
    0)
  Name: monthly_fee
# WHOLE MONTHS this licence has sat idle, as at the end of the selected period. The
# multiplier for inactivity_cost, and shown as its own column so the arithmetic in that column
# is checkable by eye: monthly_fee x months_idle.
#
# Deliberately cumulative, NOT capped at the selected period. A licence last used in March
# and still being billed in September has wasted six months of fees, and reporting only
# September's one month understated the case for reclaiming it by a factor of six. days_idle
# beside it is the same span expressed in days.
#
# The branches, in order:
#  1. Never consumed credits -> count from the first day it was ever billed, +1 because
#     that first month was itself never used. Without this the licences that have NEVER
#     been touched would report 0 wasted months, which is exactly backwards.
#  2. Last activity predates the first fee line -> same treatment. Guards against reporting
#     more wasted months than the licence has actually existed for.
#  3. Active again AFTER the period ended -> the number of months in the selected period.
#     A licence on this table consumed nothing across the whole period, so the period's own
#     months are idle regardless of what happened afterwards. This returned 0 first, which
#     contradicted the row's presence in the table and zeroed a genuine Inactivity Cost -
#     see the equivalent branch of days_idle for the measurement that is not reachable here
#     and why.
#  4. Otherwise whole months from last activity to the end of the period. No +1 here: the
#     month they last worked in was used, so it is not wasted.
#
# Both dates are truncated to the 1st before the subtraction, which is the same idiom the
# retired months_since_last_bill used. Without it, dateDiff on "MM" leaves it open whether
# March 26th to September 10th is five elapsed months or six month boundaries; truncating
# makes it unambiguously six, counting April through September as the wasted months.
# Activity on the 5th and activity on the 28th of the same month must give the same answer,
# because Kiro bills by the calendar month either way.
- DataSetIdentifier: kiro_cur_view
  Expression: >-
    ifelse(
      isNull({last_activity_date}), dateDiff(truncDate("MM", {first_billed_date}), truncDate("MM", {period_end}), "MM") + 1,
      {last_activity_date} < {first_billed_date}, dateDiff(truncDate("MM", {first_billed_date}), truncDate("MM", {period_end}), "MM") + 1,
      {last_activity_date} > {period_end}, {months_in_period},
      dateDiff(truncDate("MM", {last_activity_date}), truncDate("MM", {period_end}), "MM")
    )
  Name: months_idle
# Whole calendar months spanned by the selected Billing period - 1 for a single month, 9 for
# a January-to-September window. The floor used by branch 3 of months_idle above.
- DataSetIdentifier: kiro_cur_view
  Expression: dateDiff(truncDate("MM", {period_start}), truncDate("MM", {period_end}), "MM")
    + 1
  Name: months_in_period
# THE COST OF THE IDLE MONTHS: monthly fee times whole months idle. Both factors are
# explained above, and both are shown as their own columns in the idle table so this number
# can be checked by eye - Months Idle x Monthly Fee = Inactivity Cost.
#
# Surfaced as "Inactivity Cost". Two earlier names were both wrong in the same direction.
# "Wasted Since Last Use" passed a verdict the dashboard cannot support: it can see that
# nobody consumed credits, but not whether the spend was justified - parental leave, a
# contractor between projects, a licence held for a role rather than a person. "Spend Since
# Last Use" then read as every dollar spent on the licence since that date, which is not
# what the arithmetic produces: the month of last activity is excluded, because that month
# was used. This is specifically the cost attributable to the months of inactivity, which is
# both what it computes and what a customer needs in order to act.
#
# CUMULATIVE, NOT PERIOD-SCOPED, and that is the point of it. Two earlier versions were
# both scoped to the selected period and both understated the case for reclaiming a
# licence:
#   1. Sum of the fee lines dated after the last day of activity. Exact for daily-prorated
#      subscriptions, but all-or-nothing for month-anchored ones - 28 of the 29 licences
#      seen in real data. A month-anchored fee is one line dated the 1st, so any activity
#      at all in the month put the whole fee before the last-activity date and the licence
#      reported 0.00 wasted. Someone active on the 2nd and idle for 29 days looked
#      perfectly efficient.
#   2. The period's fee pro-rated by idle days in the period. Fixed that, but still only
#      ever reported ONE month. The licence last used 2026-03-26 and still billed in
#      September showed 20.00 - September's fee - when six months of fees had actually gone
#      out since anyone touched it.
# This version reports the whole waste: 20.00 x 6 = 120.00 for that licence.
#
# The approximation, worth knowing: it applies the CURRENT monthly fee to every idle month.
# A licence that changed tier while idle is valued at today's tier for the whole stretch.
# Reconstructing the fee month by month would need a window per month, and the tier of an
# untouched licence rarely changes, so the simpler reading wins.
#
# Constant per licence, so the field well MUST take MAX. SUM would multiply it by the
# licence's CUR row count - about 30x for a daily-prorated subscription. The idle table has
# no subtotals or grand total (TableOptions carries no TotalOptions), so MAX at the row
# grain is all that is displayed; adding totals later would need this revisited, because a
# total across licences genuinely wants the sum of these per-licence values.
- DataSetIdentifier: kiro_cur_view
  Expression: '{monthly_fee} * {months_idle}'
  Name: inactivity_cost
# How many whole calendar months this licence has been paid for, counting the first billed
# month itself. Not displayed on its own - it exists to give months_active something to
# subtract from.
#
# TRUNCATED BY THE VIEW WINDOW. kiro_cur_view keeps 18 months of CUR, so a licence bought
# before that reports 18 rather than its true age, and first_billed_date beside it reads as
# the oldest date the view can see rather than the real start. A licence sitting exactly at
# the window edge is the tell. Widening the view's INTERVAL is the only fix, at the cost of
# SPICE refresh and Athena scan time.
- DataSetIdentifier: kiro_cur_view
  Expression: dateDiff(truncDate("MM", {first_billed_date}), truncDate("MM", {period_end}),
    "MM") + 1
  Name: months_licensed
# HOW LONG THIS PERSON ACTUALLY USED KIRO, in whole months, ending the month they last
# consumed credits. The point of it is proportion: a licence used steadily for a year and
# quiet for two months is a very different conversation from one used for a fortnight and
# quiet for six, and the idle figures alone cannot tell those apart. Someone on parental
# leave or between projects looks identical to an abandoned licence until you can see how
# long they were productive first.
#
# Derived by subtraction - months licensed minus months idle - so it needs no window of its
# own and cannot disagree with the two columns either side of it. It is a SPAN, from the
# first bill to the last activity, so a user who worked in January and again in December
# reads as 12 rather than 2. Consistency of use is a question for the Credit & Overage
# sheet; this column answers how long they have been on the tool.
#
# Clamped at 0 for the licence that has never consumed credits at all, where months_idle
# covers the entire licensed life and the subtraction would otherwise go negative.
- DataSetIdentifier: kiro_cur_view
  Expression: ifelse({months_licensed} - {months_idle} > 0, {months_licensed} - {months_idle},
    0)
  Name: months_active
