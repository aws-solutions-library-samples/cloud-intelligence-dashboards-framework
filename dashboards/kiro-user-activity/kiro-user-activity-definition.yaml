# Top-N users for the "Top 50 Users by Message Count (by Model)" bar chart.
#
# Ranks on SUM(model_messages_num), NOT COUNT. COUNT counts ROWS, and this dataset
# has one row per user per day per MODEL, so ranking by COUNT ranked users by how
# many models they had touched rather than by how much they used Kiro. Measured on
# 2026-09-08: tom_haddad ranked 6th on row count but 18th on real messages (874),
# and priya_garcia 10th versus 24th (262 messages). Harmless while there are fewer
# users than the limit, wrong as soon as there are more.
#
# model_messages_num rather than total_messages_num so this matches the measure the
# chart actually plots. The two agree per user (both sum to 138,840 dataset-wide);
# total_messages_num is only populated on one of each user-day's model rows.
- CrossDataset: SINGLE_DATASET
  FilterGroupId: 707f9762-b778-456a-a299-c3e8d31f03eb
  Filters:
  - TopBottomFilter:
      AggregationSortConfigurations:
      - AggregationFunction:
          NumericalAggregationFunction:
            SimpleNumericalAggregation: SUM
        Column:
          ColumnName: model_messages_num
          DataSetIdentifier: kiro_user_activity
        SortDirection: DESC
      # `user`, not user_email: this must be the SAME column the chart it scopes
      # (1d7afd39) groups by, or the filter picks its top 50 in one identity space and
      # the chart draws bars in another. user_email is also blank on rows where the
      # source report omitted it, so a Top-N on it produced a blank category that did
      # not correspond to any bar. `user` falls back to the userid for a user with no
      # email at all, so it is never blank.
      Column:
        ColumnName: user
        DataSetIdentifier: kiro_user_activity
      FilterId: 0f5feab3-7947-47c3-8347-4bcf31c9edb6
      Limit: 50
  ScopeConfiguration:
    SelectedSheets:
      SheetVisualScopingConfigurations:
      - Scope: SELECTED_VISUALS
        SheetId: 6be25593-1f88-4d18-891d-5b8aa3828fa6
        VisualIds:
        - 1d7afd39-eec5-40fc-9da3-2f060a0648a8
  Status: ENABLED
# BILLED-IN-PERIOD GUARD. Defines the subscription roster as "licences that appear on
# the selected billing period's bill", which is what makes every kiro_cur_view visual
# answer a question about that month. It also does what the old months_since_last_bill
# <= 1 guard did, but without the fudge: a licence cancelled in July simply has no fee
# line in August and drops out of an August view by itself.
#
# Without this the KPIs would count every licence in the 18-month view window.
#
# This has to be duplicated per sheet: QuickSight rejects a single FilterGroup that
# spans multiple sheets with SELECTED_VISUALS scope (it requires ALL_VISUALS on each
# sheet in that case). The two groups below are otherwise identical.
- CrossDataset: SINGLE_DATASET
  FilterGroupId: fg-kiro-current-subs-exec
  Filters:
  - NumericRangeFilter:
      Column:
        ColumnName: period_fees
        DataSetIdentifier: kiro_cur_view
      FilterId: filter-kiro-current-subs-exec
      IncludeMinimum: false
      NullOption: NON_NULLS_ONLY
      RangeMinimum:
        StaticValue: 0.0
  ScopeConfiguration:
    SelectedSheets:
      SheetVisualScopingConfigurations:
      - Scope: SELECTED_VISUALS
        SheetId: 8b044d5a-3941-4e30-be58-fa08a3770aba
        VisualIds:
        - kpi-total-subs
        - kpi-active-users
        - kpi-inactive-users
  Status: ENABLED
- CrossDataset: SINGLE_DATASET
  FilterGroupId: fg-kiro-current-subs-engagement
  Filters:
  - NumericRangeFilter:
      Column:
        ColumnName: period_fees
        DataSetIdentifier: kiro_cur_view
      FilterId: filter-kiro-current-subs-engagement
      IncludeMinimum: false
      NullOption: NON_NULLS_ONLY
      RangeMinimum:
        StaticValue: 0.0
  ScopeConfiguration:
    SelectedSheets:
      SheetVisualScopingConfigurations:
      - Scope: SELECTED_VISUALS
        SheetId: 6be25593-1f88-4d18-891d-5b8aa3828fa6
        VisualIds:
        - table-inactive-users
  Status: ENABLED
# ACTIVE / INACTIVE SPLIT, both within the selected billing period. Active consumed
# credits in the period, Inactive was billed in it and consumed nothing. The KPIs and the
# User Engagement table apply the same test, so they cannot contradict each other.
#
# The split stays exhaustive, so Active + Inactive = Total Subscriptions still holds. On
# top of the billed-in-period guard above, period_credits is either > 0 or = 0 and the
# boundary is claimed exactly once. Note that no NULL handling is needed anywhere now:
# period_credits is a sumOver, so a licence that consumed nothing has 0 rather than the
# NULL that the old dateDiff-based days_idle produced. That NULL used to need
# NullOption: ALL_VALUES on the inactive side to avoid discarding never-used licences -
# the most reclaimable ones - and getting that wrong silently hid them.
- CrossDataset: SINGLE_DATASET
  FilterGroupId: fg-kiro-active-users
  Filters:
  - NumericRangeFilter:
      Column:
        ColumnName: period_credits
        DataSetIdentifier: kiro_cur_view
      FilterId: filter-kiro-active-users
      IncludeMinimum: false
      NullOption: NON_NULLS_ONLY
      RangeMinimum:
        StaticValue: 0.0
  ScopeConfiguration:
    SelectedSheets:
      SheetVisualScopingConfigurations:
      - Scope: SELECTED_VISUALS
        SheetId: 8b044d5a-3941-4e30-be58-fa08a3770aba
        VisualIds:
        - kpi-active-users
  Status: ENABLED
- CrossDataset: SINGLE_DATASET
  FilterGroupId: fg-kiro-inactive-users
  Filters:
  - NumericEqualityFilter:
      Column:
        ColumnName: inactive_in_period
        DataSetIdentifier: kiro_cur_view
      FilterId: filter-kiro-inactive-users
      MatchOperator: EQUALS
      NullOption: NON_NULLS_ONLY
      Value: 1.0
  ScopeConfiguration:
    SelectedSheets:
      SheetVisualScopingConfigurations:
      - Scope: SELECTED_VISUALS
        SheetId: 8b044d5a-3941-4e30-be58-fa08a3770aba
        VisualIds:
        - kpi-inactive-users
  Status: ENABLED
# Same test as fg-kiro-inactive-users above, on the User Engagement table. Separate
