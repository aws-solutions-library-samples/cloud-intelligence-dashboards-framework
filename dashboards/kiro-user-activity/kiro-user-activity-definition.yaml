      VisualId: 2e71bb79-dc17-4168-a602-f3b2f8d72158
  - PivotTableVisual:
      Actions:
      - ActionOperations:
        - FilterOperation:
            SelectedFieldsConfiguration:
              SelectedFields:
              - field-model-t1
            TargetVisualsConfiguration:
              SameSheetTargetVisualConfiguration:
                TargetVisualOptions: ALL_VISUALS
        CustomActionId: 88b08790-3528-4c8d-a583-3db1a9d18bc7
        Name: Action 1
        Status: ENABLED
        Trigger: DATA_POINT_CLICK
      ChartConfiguration:
        FieldOptions:
          DataPathOptions:
          - DataPathList:
            - FieldId: field-msgs-t2
              FieldValue: model_messages_num
            Width: 219px
          - DataPathList:
            - FieldId: field-model-t1
              FieldValue: model_name
            Width: 155px
          SelectedFieldOptions:
          - CustomLabel: Model Name
            FieldId: field-model-t1
            Visibility: VISIBLE
          - CustomLabel: Client Type
            FieldId: field-client-t1
            Visibility: VISIBLE
          - CustomLabel: Subscription Tier
            FieldId: field-tier-t1
            Visibility: VISIBLE
          - CustomLabel: User Count
            FieldId: field-users-t1
            Visibility: VISIBLE
          # "Model Messages", not "Total Messages": this is model_messages_num at
          # model grain, so a row is one model's share, never a user's total.
          - CustomLabel: Model Messages
            FieldId: field-msgs-t2
            Visibility: VISIBLE
        FieldWells:
          PivotTableAggregatedFieldWells:
            Columns: []
            Rows:
            - CategoricalDimensionField:
                Column:
                  ColumnName: model_name
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-model-t1
            - CategoricalDimensionField:
                Column:
                  ColumnName: client_type
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-client-t1
            - CategoricalDimensionField:
                Column:
                  ColumnName: subscription_tier
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-tier-t1
            Values:
            - CategoricalMeasureField:
                AggregationFunction: DISTINCT_COUNT
                Column:
                  ColumnName: userid
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-users-t1
            - NumericalMeasureField:
                AggregationFunction:
                  SimpleNumericalAggregation: SUM
                Column:
                  ColumnName: model_messages_num
                  DataSetIdentifier: kiro_user_activity
                FieldId: field-msgs-t2
            # NO CREDITS COLUMNS HERE, DELIBERATELY. Credits are only ever known per
            # user-day: the source report writes credits_used on ONE of that user-day's
            # model rows and zero on the rest, and it does not say which model spent
            # them. Grouping credits by model_name therefore does not split them, it
            # just reports which model happened to be the carrier row. Measured on
            # 2026-09-08 that put 53,819.13 of 53,928.91 credits (99.8%) on the single
            # model "Auto" and 0.00 on every other model despite tens of thousands of
            # messages. Credits per Message had the same problem twice over. Credits
            # live on the User Summary and Credit & Overage sheets, at user grain.
        SortConfiguration:
          FieldSortOptions:
          - FieldId: field-model-t1
            SortBy:
              Field:
                Direction: DESC
                FieldId: field-msgs-t2
        TableOptions:
          CellStyle: {}
          ColumnHeaderStyle: {}
          RowFieldNamesStyle: {}
      Subtitle:
        Visibility: VISIBLE
      Title:
        FormatText:
          RichText: |-
            <visual-title>
              <inline font-size="14px">Monthly Messages by Model and Client Type</inline>
            </visual-title>
        Visibility: VISIBLE
      VisualId: a9f28fd8-8820-41d7-a4b9-60a1f295534d
# Static "About" sheet, mirroring the Notices tab on the CUDOS dashboard. It is
# text-only (no visuals, no filter controls) and carries the standard AWS
# informational-use disclaimer, the dashboard name/version, and CID links.
- ContentType: INTERACTIVE
  Layouts:
  - Configuration:
      GridLayout:
        CanvasSizeOptions:
          ScreenCanvasSizeOptions:
            OptimizedViewPortWidth: 1600px
            ResizeOption: FIXED
        Elements:
        - ColumnIndex: 0
          ColumnSpan: 36
          ElementId: 8982dad8-c41f-45be-a383-2a662eeacbac
          ElementType: TEXT_BOX
          RowIndex: 0
          RowSpan: 8
        - ColumnIndex: 0
          ColumnSpan: 36
          ElementId: fdd229b0-07cb-4b93-b634-0a2357c4b4b1
          ElementType: TEXT_BOX
          RowIndex: 8
          RowSpan: 4
        - ColumnIndex: 0
          ColumnSpan: 36
          ElementId: a6e4980b-1629-4c09-8a27-d003e813f20a
          ElementType: TEXT_BOX
          RowIndex: 12
          RowSpan: 4
  Name: About
  SheetId: 67b78df7-be55-4830-a8c1-1213be241a08
  TextBoxes:
  # "Notices" heading + standard AWS informational-use disclaimer, sized to
  # match the CUDOS v5 About tab (54.88px heading, 22.4px body).
