        FieldWells:
          BarChartAggregatedFieldWells:
            Category:
            - DateDimensionField:
                Column:
                  ColumnName: usage_date
                  DataSetIdentifier: kiro_user_activity
                DateGranularity: DAY
                FieldId: field-date-m1
                HierarchyId: ac825248-8570-4682-9d43-f689950f9e1d
            Colors:
