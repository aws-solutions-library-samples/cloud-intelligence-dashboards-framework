            Name: TotalAggregate2
            Value:
              CategoricalMeasureField:
                AggregationFunction: DISTINCT_COUNT
                Column:
                  ColumnName: accountid
                  DataSetIdentifier: rds_inventory_dataset
                FieldId: 89a6ea90-658c-45f6-921b-19de525d50fb.accountid.4.1741362876606
        CustomNarrative:
          Narrative: "<narrative>\n  &#128200;\n  <b>Top\_</b>\n  <if condition=\"\
            Top.itemsCount &gt; 1\" level=\"inline\">\n    <b>\n      <expression>Top.itemsCount</expression>\n\
            \    </b>\n    <b>\_</b>\n  </if>\n  <b>\n    <expression>Top.categoryField.name</expression>\n\
            \  </b>\n  <b>s with count of DB Instance per account</b>\n  <if condition=\"\
            Top.itemsCount &gt; 1\" level=\"inline\">:</if>\n  <if condition=\"Top.itemsCount\
            \ &lt; 2\" level=\"inline\">\_is:</if>\n  <br/>\n  <for level=\"block\"\
            \ listExpression=\"Top.items\">\n    <ul>\n      <li class=\"ql-indent-0\"\
            >\n        <inline color=\"Accent\">\n          <b>\n            <expression>Top.items[index].categoryValue.formattedValue</expression>\n\
            \          </b>\n        </inline>\n        <b>\_</b>\n        with\n\
            \        <b>\_</b>\n        <b>\n          <expression>Top.items[index].metricValue.formattedValue</expression>\n\
            \        </b>\n        \_DB instance\n      </li>\n    </ul>\n  </for>\n\
            \  <br/>\n  <br/>\n  <b>&#128161; Insights:</b>\n  <br/>\n  <for level=\"\
            block\" listExpression=\"Top.items\">\n    <ul>\n      <li class=\"ql-indent-0\"\
            >\n        <b>\_</b>\n        Account\n        <b>\_</b>\n        <b>\n\
            \          <expression>Top.items[index].categoryValue.formattedValue</expression>\n\
            \        </b>\n        <b>\_</b>\n        hosts\n        <b>\_</b>\n \
            \       <b>\n          <expression>round(((Top.items[index].metricValue.value)/(TotalAggregate.totalAggregate.value))*100)</expression>\n\
            \        </b>\n        <b>%\_</b>\n        DB Instances\n      </li>\n\
            \    </ul>\n  </for>\n  <br/>\n  <br/>\n  <b>&#128202; Key Metrics:</b>\n\
            \  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">\n      \_Total number\
            \ of Accounts hosting RDS DB Instances:\n      <b>\n        <expression>TotalAggregate2.totalAggregate.formattedValue</expression>\n\
            \      </b>\n    </li>\n    <li class=\"ql-indent-0\">\n      \_Total\
            \ number of DB Instances :\n      <b>\n        <expression>TotalAggregate.totalAggregate.formattedValue</expression>\n\
            \      </b>\n      <b>\_</b>\n    </li>\n  </ul>\n</narrative>"
      Subtitle:
        Visibility: VISIBLE
      Title:
