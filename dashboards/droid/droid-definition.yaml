            \     <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \    </inline>\n    <if condition=\"PeriodOverPeriod.percentDifference.value\
            \ &gt;= 0\" level=\"inline\">\n      <inline color=\"Accent\" font-size=\"\
            19.2px\">\n        <b>\_increased by\_</b>\n      </inline>\n    </if>\n\
            \    <if condition=\"PeriodOverPeriod.percentDifference.value &lt; 0\"\
            \ level=\"inline\">\n      <inline color=\"Accent\" font-size=\"19.2px\"\
            >\n        <b>\_decreased by\_</b>\n      </inline>\n    </if>\n    <inline\
            \ color=\"Accent\" font-size=\"19.2px\">\n      <b>\n        <expression>PeriodOverPeriod.percentDifference.formattedAbsoluteValue</expression>\n\
            \      </b>\n    </inline>\n    <inline color=\"Accent\" font-size=\"\
            19.2px\">\n      <b>\_</b>\n    </inline>\n    <inline color=\"Accent\"\
            \ font-size=\"19.2px\">\n      <b>\n        <expression>PeriodOverPeriod.absoluteDifference.formattedValue</expression>\n\
            \      </b>\n    </inline>\n    <inline font-size=\"19.2px\">\_from\_\
            </inline>\n    <inline font-size=\"19.2px\">\n      <expression>PeriodOverPeriod.previousMetricValue.formattedValue</expression>\n\
            \    </inline>\n    <inline font-size=\"19.2px\">\_to\_</inline>\n   \
            \ <inline font-size=\"19.2px\">\n      <expression>PeriodOverPeriod.currentMetricValue.formattedValue</expression>\n\
            \    </inline>\n    <inline font-size=\"19.2px\">.</inline>\n  </if>\n\
            \  <br/>\n  <br/>\n  <br/>\n  \u2197\uFE0F\n  <inline font-size=\"22.4px\"\
            >Top Movers:</inline>\n  <br/>\n  <if condition=\"TopMovers.itemsCount\
            \ &lt; 1\" level=\"block\">\n    <inline font-size=\"19.2px\">&#128314;\
            \ There is no Top Movers for the Month of\_</inline>\n    <inline font-size=\"\
