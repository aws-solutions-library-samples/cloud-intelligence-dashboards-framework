            \ There is/are\_\_</inline>\n    <inline font-size=\"19.2px\">\n     \
            \ <b>\n        <expression>TopMovers.itemsCount</expression>\n      </b>\n\
            \    </inline>\n    <inline font-size=\"19.2px\">\_Top Movers for the\
            \ month of\_</inline>\n    <inline font-size=\"19.2px\">\n      <b>\n\
            \        <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \      </b>\n    </inline>\n  </if>\n  <br/>\n  <for level=\"block\" listExpression=\"\
            TopMovers.items\">\n    <ul>\n      <li class=\"ql-indent-0\">\n     \
            \   <inline font-size=\"19.2px\">Account\_</inline>\n        <inline font-size=\"\
            19.2px\">\n          <b>\n            <expression>TopMovers.items[index].categoryValue.value</expression>\n\
            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_spend increased from\_</inline>\n        <inline font-size=\"19.2px\"\
            >\n          <b>\n            <expression>TopMovers.items[index].previousMetricValue.formattedValue</expression>\n\
            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_to\_</inline>\n        <inline font-size=\"19.2px\">\n          <b>\n\
            \            <expression>TopMovers.items[index].currentMetricValue.formattedValue</expression>\n\
            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_</inline>\n      </li>\n    </ul>\n  </for>\n  <br/>\n  <br/>\n  <br/>\n\
            \  \u2198\uFE0F\n  <inline font-size=\"22.4px\">Bottom Movers:\_</inline>\n\
            \  <br/>\n  <if condition=\"BottomMovers.itemsCount &lt; 1\" level=\"\
