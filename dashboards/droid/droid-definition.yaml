        CustomNarrative:
          Narrative: "<narrative>\n  <inline font-size=\"19.2px\">\n    <b>&#128202;\
            \ Snapshot Backup % by Region - Last 14 Days</b>\n  </inline>\n  <br/>\n\
            \  <br/>\n  <inline font-size=\"19.2px\">\n    <b>RDS DB</b>\n  </inline>\n\
            \  <if condition=\"Top.itemsCount &gt; 1\" level=\"inline\">\n    <inline\
            \ font-size=\"19.2px\">\n      <b>\_</b>\n    </inline>\n  </if>\n  <inline\
            \ font-size=\"19.2px\">\n    <b>\n      <expression>Top.categoryField.name</expression>\n\
            \    </b>\n  </inline>\n  <inline font-size=\"19.2px\">\n    <b>s with\
            \ total Backup Percentages,</b>\n  </inline>\n  <br/>\n  <for level=\"\
            block\" listExpression=\"Top.items\">\n    <ul>\n      <li class=\"ql-indent-0\"\
            >\n        <inline color=\"Accent\">RDS DB Engine</inline>\n        <inline\
            \ color=\"Accent\">\n          <b>\_</b>\n        </inline>\n        <inline\
            \ color=\"Accent\">\n          <b>\n            <expression>Top.items[index].categoryValue.formattedValue</expression>\n\
            \          </b>\n        </inline>\n        \_with Backup Coverage  of\n\
            \        <if condition=\"Top.items[index].metricValue.value = 1\" level=\"\
            inline\">\n          <inline color=\"#92ac61\">\n            <b>\n   \
            \           <expression>Top.items[index].metricValue.formattedValue</expression>\n\
            \            </b>\n          </inline>\n        </if>\n        <if condition=\"\
            Top.items[index].metricValue.value &gt;= .5 and Top.items[index].metricValue.value\
            \ &lt;= .9\" level=\"inline\">\n          <inline color=\"#f0cc16\">\n\
            \            <b>\n              <expression>Top.items[index].metricValue.formattedValue</expression>\n\
            \            </b>\n          </inline>\n        </if>\n        \uFEFF\uFEFF\
            \uFEFF\uFEFF\n        <if condition=\"Top.items[index].metricValue.value\
            \ &lt; 0.5\" level=\"inline\">\n          <inline color=\"#e86b5f\">\n\
            \            <b>\n              <expression>Top.items[index].metricValue.formattedValue</expression>\n\
            \            </b>\n          </inline>\n        </if>\n        \_\uFEFF\
            \uFEFF\n        <if condition=\"Top.items[index].metricValue.value &gt;\
            \ .9 and Top.items[index].metricValue.value &lt; 1\" level=\"inline\"\
            >\n          <inline color=\"#e7f6c9\">\n            <b>\n           \
            \   <expression>Top.items[index].metricValue.formattedValue</expression>\n\
            \            </b>\n          </inline>\n        </if>\n      </li>\n \
            \   </ul>\n  </for>\n  <br/>\n</narrative>"
