  SheetId: 1edb8068-0e24-4cdc-b94a-b4b77a911e68
  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"20px\">\n    <b>Service Quotas Dashboard</b>\n  </inline>\n  <br/>\n  <b>Version: 1.0.1</b>\n   (updated 17 November 2026)\n  <br/>\n  <br/>\n  <inline font-size=\"24px\">\n    <b>About This Dashboard</b>\n  </inline>\n  <br/>\n  Service Quotas Dashboard provides org-wide visibility into AWS service quota consumption across all accounts, regions, and services — collected automatically via the CID Data Collection framework.\n  <br/>\n  <br/>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>What This Dashboard Is For</b>\n  </inline>\n  <br/>\n  AWS service quotas define the maximum limits for resources and API calls across every AWS service. When a quota is reached, workloads fail — deployments block, API calls return errors, and incidents follow. This dashboard gives engineering and operations teams a proactive view of quota consumption across their entire AWS Organization, enabling them to identify risks before they become incidents.\n  <br/>\n\
      \  <br/>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>What's New in 1.0.1</b>\n  </inline>\n  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">Service Quota Utilization High Level Overview is now a bar chart on a fixed 0–100% scale, highest utilization first, with fixed colors: green below 20%, amber 20–80%, red 80% and above.</li>\n    <li class=\"ql-indent-0\">Number of quotas to show works again (top quotas by utilization, up to 200).</li>\n    <li class=\"ql-indent-0\">Risk level always lists all three options (High, Medium, Low), even when no quota is currently in a band.</li>\n    <li class=\"ql-indent-0\">The Quotas with usage reported KPI replaces Total Quota Utilization Value, which counted rows instead of quotas.</li>\n    <li class=\"ql-indent-0\">New Quota Comparison tab: compare quota limits between two accounts, or between the regions of one account.</li>\n    <li class=\"ql-indent-0\">The Detailed View tab is replaced by Quota Comparison, which covers the same side-by-side\
      \ account view and adds region comparison.</li>\n  </ul>\n  <br/>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Dashboard Views-Overview Tab </b>\n  </inline>\n  <br/>\n  High-level summary of quota coverage and consumption across the organization:\n  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">Total Accounts — number of accounts in scope</li>\n    <li class=\"ql-indent-0\">Total Service Quotas Tracked — count of distinct quota codes collected across all accounts and regions</li>\n    <li class=\"ql-indent-0\">Total Services Tracked — number of AWS services under quota monitoring</li>\n    <li class=\"ql-indent-0\">Total AWS Regions Covered — number of active regions in scope</li>\n    <li class=\"ql-indent-0\">Total Adjustable Service Quotas — quotas eligible for limit increase requests</li>\n    <li class=\"ql-indent-0\">Quotas with usage reported — number of quota / account / region combinations where AWS reports utilization above 0%</li>\n  </ul>\n  <br/>\n  <br/>\n  <b>Quota\
      \ Count by AWS Service </b>\n  — ranks AWS services by number of quotas tracked. Use this to understand which services have the broadest quota surface area in your environment.\n  <br/>\n  <b>Service Quota Count by Region </b>\n  — distribution of quota codes across regions. us-east-1 typically has the highest count as AWS launches new services there first.\n  <br/>\n  <b>Adjustable vs Non-Adjustable Quotas</b>\n  — proportion of quotas that can be increased via a service limit request vs hard limits that cannot be changed.\n  <br/>\n  <b>Global vs Regional Quota Distribution </b>\n  — identifies quotas that apply account-wide (global) vs those scoped to a specific region.\n  <br/>\n  <b>Adjusted Service Quotas Breakdown</b>\n  — shows quotas where the current value differs from the AWS default. Use this to spot which services have been manually tuned and by how much across accounts and regions.\n  <br/>\n  <b>Service Quota Utilization High Level Overview by Account </b>\n  — one bar\
      \ per quota, account and region, highest utilization first, on a 0–100% scale. Colors are fixed: green below 20%, amber 20–80%, red 80% and above. Controls above the chart: Number of quotas to show, Minimum utilization %, and Risk level (High, Medium, Low).\n  <br/>\n  <b>Service Quota Utilization Details by Account </b>\n  — shows quotas where AWS reports active usage metrics with utilization above 0%. Based on periodic snapshots (not live data). Use this to identify quotas approaching their limit.\n  <br/>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Dashboard Views-Quota Comparison </b>\n  </inline>\n  <br/>\n  <inline font-size=\"14px\">Shows which quota limits differ between side A and side B. Latest snapshot only.</inline>\n  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">Two different accounts: pick Account A and Account B (or click an account in the Accounts table and choose Set as Account A / Set as Account B). Each quota in each region is compared with the same region in\
      \ the other account. All regions by default; narrow with Region and Service.</li>\n    <li class=\"ql-indent-0\">Same account in A and B: each region is compared with the highest limit for that quota across the regions shown. Pick two regions in Region to compare just those two.</li>\n    <li class=\"ql-indent-0\">Status: Different or Lower than other regions = the limits don't match; Only in A / Only in B = the quota was collected on one side only; Same = the limits match. Anything other than Same is highlighted.</li>\n    <li class=\"ql-indent-0\">Show = Differences only (default) hides quotas that match; All shows every quota.</li>\n    <li class=\"ql-indent-0\">Columns: Limit – A, Limit – B / highest region, Difference (A − B).</li>\n  </ul>\n  <br/>\n  <br/>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Fields Reference</b>\n  </inline>\n  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">account_id — AWS account ID</li>\n    <li class=\"ql-indent-0\">region — AWS region where the\
      \ quota applies</li>\n    <li class=\"ql-indent-0\">servicename — AWS service name (e.g. Amazon EC2, AWS Lambda)</li>\n    <li class=\"ql-indent-0\">quotacode — Unique quota identifier (e.g. L-1216C47A)</li>\n    <li class=\"ql-indent-0\">quotaname — Human-readable quota description</li>\n    <li class=\"ql-indent-0\">currentvalue — Applied quota limit in this account — may differ from the default if a limit increase was previously requested</li>\n    <li class=\"ql-indent-0\">defaultvalue — AWS baseline limit before any customer-requested increases</li>\n    <li class=\"ql-indent-0\">adjustable — Whether this quota supports limit increase requests</li>\n    <li class=\"ql-indent-0\">globalquota — Whether this quota applies account-wide (true) or is scoped per-region (false)</li>\n    <li class=\"ql-indent-0\">utilization — % of the quota consumed at collection time — only available for quotas where AWS natively tracks usage (~1,255 quotas across ~68 services)</li>\n    <li class=\"\
      ql-indent-0\">collection_date — Timestamp of when this data was collected — refreshes every 14 days</li>\n  </ul>\n  <br/>\n  <br/>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Data Freshness</b>\n  </inline>\n  <br/>\n  Data is collected every 14 days via the CID Data Collection framework. The dashboard defaults to the latest\n  <inline font-size=\"12px\">collection_date</inline>\n  . Use the collection date filter to compare quota posture over time.\n</text-box>"
    SheetTextBoxId: a235a6c6-6426-4584-8e1f-164da83baee0
