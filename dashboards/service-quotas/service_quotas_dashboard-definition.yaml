CalculatedFields:
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'ifelse(adjustable = 1, ''Adjustable'', ''Non-Adjustable'')

    '
  Name: adjustable_label
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'ifelse(currentvalue = defaultvalue, ''No'', ''Yes'')

    '
  Name: adjusted_flag
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse(isNotNull(utilization) AND utilization <> '', 'Yes', 'No')
  Name: has_utilization
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'ifelse(globalquota = 1, ''Global'', ''Regional'')

    '
  Name: scope_label
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: |-
    ifelse(
      parseDecimal(utilization) > 0,
      parseDecimal(utilization),
      null
    )
  Name: utilization_nonzero
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'parseDecimal(utilization)

    '
  Name: utilization_pct
