  Name: About
  SheetId: 322b87b0-a38a-4576-bf8a-bd9eae949037
  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"20px\">\n    <b>Service Quotas Dashboard</b>\n\
      \  </inline>\n  <br/>\n  <b>Version: 1.0.0</b>\n  <br/>\n  <br/>\n  <inline\
      \ font-size=\"24px\">\n    <b>About This Dashboard</b>\n  </inline>\n  <br/>\n\
      \  Service Quotas Dashboard provides org-wide visibility into AWS service quota\
      \ consumption across all accounts, regions, and services \u2014 collected automatically\
      \ via the CID Data Collection framework.\n  <br/>\n  <br/>\n  <br/>\n  <inline\
      \ font-size=\"20px\">\n    <b>What This Dashboard Is For</b>\n  </inline>\n\
      \  <br/>\n  AWS service quotas define the maximum limits for resources and API\
      \ calls across every AWS service. When a quota is reached, workloads fail \u2014\
      \ deployments block, API calls return errors, and incidents follow. This dashboard\
      \ gives engineering and operations teams a proactive view of quota consumption\
      \ across their entire AWS Organization, enabling them to identify risks before\
      \ they become incidents.\n  <br/>\n  <br/>\n  <br/>\n  <inline font-size=\"\
      20px\">\n    <b>Dashboard Views-Overview Tab\_</b>\n  </inline>\n  <br/>\n \
      \ High-level summary of quota coverage and consumption across the organization:\n\
      \  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">Total Service Quotas Tracked\
      \ \u2014 count of distinct quota codes collected across all accounts and regions</li>\n\
      \    <li class=\"ql-indent-0\">Total Services Tracked \u2014 number of AWS services\
      \ under quota monitoring</li>\n    <li class=\"ql-indent-0\">Total AWS Regions\
      \ Covered \u2014 number of active regions in scope</li>\n    <li class=\"ql-indent-0\"\
      >Total Adjustable Service Quotas \u2014 quotas eligible for limit increase requests</li>\n\
      \    <li class=\"ql-indent-0\">Total Quota Utilization Value \u2014 aggregate\
      \ utilization across all quotas where AWS reports usage metrics</li>\n  </ul>\n\
      \  <br/>\n  <br/>\n  <b>Quota Count by AWS Service\_</b>\n  \u2014 ranks AWS\
      \ services by number of quotas tracked. Use this to understand which services\
      \ have the broadest quota surface area in your environment.\n  <br/>\n  <b>Service\
      \ Quota Count by Region\_</b>\n  \u2014 distribution of quota codes across regions.\
      \ us-east-1 typically has the highest count as AWS launches new services there\
      \ first.\n  <br/>\n  <b>Adjustable vs Non-Adjustable Quotas</b>\n  \_\u2014\
      \ proportion of quotas that can be increased via a service limit request vs\
      \ hard limits that cannot be changed.\n  <br/>\n  <b>Global vs Regional Quota\
      \ Distribution\_</b>\n  \u2014 identifies quotas that apply account-wide (global)\
      \ vs those scoped to a specific region.\n  <br/>\n  <b>Adjusted Service Quotas\
      \ Breakdown</b>\n  \_\u2014 shows quotas where the current value differs from\
      \ the AWS default. Use this to spot which services have been manually tuned\
      \ and by how much across accounts and regions.\n  <br/>\n  <b>Service Quota\
      \ Utilization Details by Account\_</b>\n  \u2014 shows quotas where AWS reports\
      \ active usage metrics with utilization above 0%. Based on periodic snapshots\
      \ (not live data). Use this to identify quotas approaching their limit.\n  <br/>\n\
      \  <br/>\n  <inline font-size=\"20px\">\n    <b>Dashboard Views-Detailed View\_\
      </b>\n  </inline>\n  <br/>\n  <inline font-size=\"14px\">Tab Side-by-side comparison\
      \ of quota values across two accounts and regions. Use this to:</inline>\n \
      \ <br/>\n  <ul>\n    <li class=\"ql-indent-0\">Compare quota posture between\
      \ accounts</li>\n    <li class=\"ql-indent-0\">Identify discrepancies in applied\
      \ limits across regions</li>\n    <li class=\"ql-indent-0\">Spot quotas with\
      \ zero current usage that may indicate unused capacity reservations</li>\n \
      \ </ul>\n  <br/>\n  <br/>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Fields\
      \ Reference</b>\n  </inline>\n  <br/>\n  <ul>\n    <li class=\"ql-indent-0\"\
      >account_id \u2014 AWS account ID</li>\n    <li class=\"ql-indent-0\">region\
      \ \u2014 AWS region where the quota applies</li>\n    <li class=\"ql-indent-0\"\
      >servicename \u2014 AWS service name (e.g. Amazon EC2, AWS Lambda)</li>\n  \
      \  <li class=\"ql-indent-0\">quotacode \u2014 Unique quota identifier (e.g.\
      \ L-1216C47A)</li>\n    <li class=\"ql-indent-0\">quotaname \u2014 Human-readable\
      \ quota description</li>\n    <li class=\"ql-indent-0\">currentvalue \u2014\
      \ Applied quota limit in this account \u2014 may differ from the default if\
      \ a limit increase was previously requested</li>\n    <li class=\"ql-indent-0\"\
      >defaultvalue \u2014 AWS baseline limit before any customer-requested increases</li>\n\
      \    <li class=\"ql-indent-0\">adjustable \u2014 Whether this quota supports\
      \ limit increase requests</li>\n    <li class=\"ql-indent-0\">globalquota \u2014\
      \ Whether this quota applies account-wide (true) or is scoped per-region (false)</li>\n\
      \    <li class=\"ql-indent-0\">utilization \u2014 % of the quota consumed at\
      \ collection time \u2014 only available for quotas where AWS natively tracks\
      \ usage (~1,255 quotas across ~68 services)</li>\n    <li class=\"ql-indent-0\"\
      >collection_date \u2014 Timestamp of when this data was collected \u2014 refreshes\
      \ every 14 days</li>\n  </ul>\n  <br/>\n  <br/>\n  <br/>\n  <inline font-size=\"\
      20px\">\n    <b>Data Freshness</b>\n  </inline>\n  <br/>\n  Data is collected\
      \ every 14 days via the CID Data Collection framework. The dashboard defaults\
      \ to the latest\n  <inline font-size=\"12px\">collection_date</inline>\n  .\
      \ Use the collection date filter to compare quota posture over time.\n</text-box>"
    SheetTextBoxId: a235a6c6-6426-4584-8e1f-164da83baee0
  Visuals: []
