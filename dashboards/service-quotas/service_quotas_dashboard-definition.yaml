AnalysisDefaults:
  DefaultNewSheetConfiguration:
    InteractiveLayoutConfiguration:
      Grid:
        CanvasSizeOptions:
          ScreenCanvasSizeOptions:
            OptimizedViewPortWidth: 1600px
            ResizeOption: FIXED
    SheetContentType: INTERACTIVE
CalculatedFields:
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'ifelse(adjustable = 1, ''Adjustable'', ''Non-Adjustable'')

    '
  Name: adjustable_label
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'ifelse(currentvalue = defaultvalue, ''No'', ''Yes'')

    '
  Name: adjusted_flag
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse({account_id} = ${CmpAccountA} OR {account_id} = ${CmpAccountB}, 'Yes', 'No')
  Name: cmp_in_pair
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse({account_id} = ${CmpAccountA}, currentvalue, NULL)
  Name: cmp_limit_a
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse({account_id} = ${CmpAccountB}, currentvalue, NULL)
  Name: cmp_limit_b
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse(${CmpAccountA} = ${CmpAccountB}, maxOver(max({cmp_limit_a}), [servicename, quotacode], POST_AGG_FILTER), max({cmp_limit_b}))
  Name: cmp_limit_b_view
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: max({cmp_limit_a}) - {cmp_limit_b_view}
  Name: cmp_limit_diff
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse(${CmpShow} = 'All' OR {cmp_status} <> 'Same', 1, 0)
  Name: cmp_show
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse(isNull(max({cmp_limit_a})), 'Only in B', isNull({cmp_limit_b_view}), 'Only in A', max({cmp_limit_a}) = {cmp_limit_b_view}, 'Same', ${CmpAccountA} = ${CmpAccountB}, 'Lower than other regions', 'Different')
  Name: cmp_status
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse(isNotNull(utilization) AND utilization <> '', 'Yes', 'No')
  Name: has_utilization
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: "ifelse(\n  truncDate('DD', parseDate({collection_date}, 'yyyy-MM-dd HH:mm:ss')) = {latest_refresh_date},\n  'Yes',\n  'No'\n)"
  Name: is_latest_snapshot
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: "maxOver(\n  truncDate('DD', parseDate({collection_date}, 'yyyy-MM-dd HH:mm:ss')),\n  [],\n  PRE_FILTER\n)"
  Name: latest_refresh_date
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: concat(quotacode, ' | ', {account_id}, ' | ', region)
  Name: quota_account_region
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'ifelse(globalquota = 1, ''Global'', ''Regional'')

    '
  Name: scope_label
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: ifelse(isNotNull({utilization_nonzero}), {quota_account_region}, NULL)
  Name: usage_reported_key
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: "\n\nifelse(\n  {utilization_nonzero} >= 80, 'High (>80%)',\n  {utilization_nonzero} >= 20, 'Medium (20-80%)',\n  'Low (<20%)'\n)"
  Name: utilization_band
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: "ifelse(\n  parseDecimal(utilization) > 0,\n  parseDecimal(utilization),\n  null\n)"
  Name: utilization_nonzero
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: 'parseDecimal(utilization)

    '
  Name: utilization_pct
- DataSetIdentifier: cfc8ef5d-9668-41e3-8243-b292e0d23c06
  Expression: "ifelse(\n  isNull({utilization_nonzero}), NULL,\n  {utilization_nonzero} >= 80, 'High (>=80%)',\n  {utilization_nonzero} >= 20, 'Medium (20-80%)',\n  'Low (<20%)'\n)"
  Name: utilization_risk
ColumnConfigurations:
- Column:
