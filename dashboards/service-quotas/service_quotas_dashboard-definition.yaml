  SheetId: sheet-c2247696
  TextBoxes:
  - Content: "<text-box>\n  <inline color=\"Accent\">Service Quota Utilization Details\
      \ by Account -\_</inline>\n  This view shows the service quotas that AWS reports\
      \ usage metrics for with utilization higher than 0%, based on periodic snapshots\
      \ (not live data). Each row shows how much of a quota's limit was consumed at\
      \ collection time, by account and region. Quotas with zero or no reported usage\
      \ are excluded.\n  <br/>\n</text-box>"
    SheetTextBoxId: 8778dfae-8418-4252-87bf-756617c938e3
  - Content: "<text-box>\n  <b>Service Quota Inventory \u2014 Current vs. Default\
      \ Values\_</b>\n  \u2014 This view shows the full list of service quotas collected\
      \ across all accounts and regions, displaying both the current applied limit\
      \ and the AWS default. Use this to get a complete picture of your quota posture\
      \ \u2014 rows where Current Value exceeds Default Value indicate quotas that\
      \ have been previously increased. All quotas are included regardless of utilization\
      \ status.\n</text-box>"
    SheetTextBoxId: 3f8995f4-4316-4bcc-baf8-6c961ca592c7
