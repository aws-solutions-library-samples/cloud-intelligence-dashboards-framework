  SheetId: 373d3d68-50b5-4163-9eac-15cae53e5bfc
  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"16px\">This view summarizes service quota utilization across accounts and regions, showing only quotas where AWS reports usage metrics and utilization is above 0%. Data comes from periodic snapshots, not live data, and reflects how much of each quota's limit was consumed at collection time. Quotas with zero or no reported usage are excluded.</inline>\n</text-box>"
    SheetTextBoxId: 8778dfae-8418-4252-87bf-756617c938e3
  - Content: "<text-box>\n  <inline color=\"Accent\">Service Quota Utilization Details by Account - </inline>\n  This view shows the service quotas that AWS reports usage metrics for with utilization higher than 0%, based on periodic snapshots (not live data). Each row shows how much of a quota's limit was consumed at collection time, by account and region. Quotas with zero or no reported usage are excluded.\n  <br/>\n</text-box>"
    SheetTextBoxId: 3a6b1fec-cc60-4604-ab09-8325348568b3
  - Content: "<text-box>\n  <inline font-size=\"36px\">Service Quotas Dashboard</inline>\n  <br/>\n  <inline font-size=\"16px\">Service Quotas Dashboard provides org-wide visibility into AWS service quota consumption across all accounts, regions, and services — collected automatically via the CID Data Collection framework.</inline>\n</text-box>"
    SheetTextBoxId: f8cff86f-5b59-4a74-a660-172ad951ca2b
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"32px\">\n    <b>Adjusted Service Quotas Breakdown</b>\n  </inline>\n  <br/>\n  <inline font-size=\"16px\">Quota Adjustments Detail Default vs. current values for all modified quotas across accounts and regions. Use this to spot which services have been tuned and by how much.</inline>\n</text-box>"
    SheetTextBoxId: 8227b93d-b445-4dce-b9a1-69534a8a983c
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"32px\"/>\n  <inline font-size=\"32px\">Service Quota Utilization High Level Overview </inline>\n  <br/>\n  <inline font-size=\"32px\">by Account </inline>\n</text-box>"
    SheetTextBoxId: fa5e96ec-965d-45ae-b213-3f3197b984f9
