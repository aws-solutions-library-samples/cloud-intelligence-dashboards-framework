    name: Service Quotas Dashboard
    dashboardId: service-quotas
    category: Advanced
    theme: MIDNIGHT
    version: v1.0.0
    file: ./service_quotas_dashboard-definition.yaml
datasets:
  service_quotas_data:
    data:
      DataSetId: cfc8ef5d-9668-41e3-8243-b292e0d23c06
      Name: service_quotas_data
      PhysicalTableMap:
        966bf27f-3e95-47cb-abd3-c4deefafbcd6:
          RelationalTable:
            DataSourceArn: ${athena_datasource_arn}
            Catalog: AwsDataCatalog
            Schema: ${athena_database_name}
            Name: service_quotas_data
            InputColumns:
            - Name: servicecode
              Id: service_q-serviceco-38da35
              Type: STRING
            - Name: servicename
              Id: service_q-servicena-fe3826
              Type: STRING
            - Name: quotacode
              Id: service_q-quotacode-2f89d8
              Type: STRING
            - Name: quotaname
              Id: service_q-quotaname-ccfe0f
              Type: STRING
            - Name: currentvalue
              Id: service_q-currentva-08fe9f
              Type: DECIMAL
              SubType: FLOAT
            - Name: defaultvalue
              Id: service_q-defaultva-57fe2a
              Type: DECIMAL
              SubType: FLOAT
            - Name: unit
              Id: service_q-unit-db050e
              Type: STRING
            - Name: adjustable
              Id: service_q-adjustabl-5ad7c6
              Type: BOOLEAN
            - Name: globalquota
              Id: service_q-globalquo-953a91
              Type: BOOLEAN
            - Name: quotaarn
              Id: service_q-quotaarn-371f13
              Type: STRING
            - Name: quotaappliedatlevel
              Id: service_q-quotaappl-fb80cf
