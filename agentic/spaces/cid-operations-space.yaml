# Space shared by the CID Operations Advisor and CID Security Advisor. Loaded via agentic/catalog.yaml.
# A Space owns the knowledge (dashboards, datasets, knowledge bases); agents reference it.
spaces:
  cid-operations-space:
    name: CID Operations Space
    description: >-
      Operational health and security posture knowledge from the Cloud
      Intelligence Dashboards: usage and spend, Trusted Advisor findings and
      Compute Optimizer recommendations.
    dependsOn:
      dashboards: [cudos-v5, cost_intelligence_dashboard, trends-dashboard]
      datasets:
        - ta-organizational-view
        - compute_optimizer_all_options
      knowledgeBases: []
